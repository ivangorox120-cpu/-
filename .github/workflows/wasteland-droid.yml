name: Wasteland Droid

on:
  push:
    branches: ["**"]
    paths: ["wasteland-droid/**", ".github/workflows/wasteland-droid.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p wasteland-droid assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wasteland-droid-apk
          path: wasteland-droid/app/build/outputs/apk/release/app-release.apk
