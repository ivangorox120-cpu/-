name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs
        run: gradle -p android assembleSnakeRelease assembleLarekRelease --no-daemon --stacktrace

      - name: Package game
        run: |
          mkdir -p dist/snake-boom dist/larek
          cp index.html README.md dist/snake-boom/
          cp larek/index.html larek/three.min.js larek/models.js larek/THREE-LICENSE.txt dist/larek/
          # однофайловая версия для браузера: three.min.js встраивается прямо в страницу
          python3 - <<'PY'
          html = open('larek/index.html', encoding='utf-8').read()
          for src in ['three.min.js', 'models.js']:
              tag = '<script src="%s"></script>' % src
              assert tag in html
              html = html.replace(tag, '<script>' + open('larek/' + src, encoding='utf-8').read() + '</script>')
          open('dist/larek.html', 'w', encoding='utf-8').write(html)
          PY
          cp android/app/build/outputs/apk/snake/release/app-snake-release.apk dist/snake-boom.apk
          cp android/app/build/outputs/apk/larek/release/app-larek-release.apk dist/larek.apk
          cd dist && zip -r snake-boom.zip snake-boom && zip -r larek.zip larek

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-boom-web
          path: dist/snake-boom/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-boom-apk
          path: dist/snake-boom.apk

      - name: Upload Larek web artifact
        uses: actions/upload-artifact@v4
        with:
          name: larek-web
          path: dist/larek/

      - name: Upload Larek APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: larek-apk
          path: dist/larek.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/snake-boom.apk dist/snake-boom.zip dist/snake-boom/index.html dist/larek.apk dist/larek.zip dist/larek.html \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Змейка: Бабах + Ларёк — сборка #${{ github.run_number }}" \
            --notes "**Android:** \`snake-boom.apk\` — змейка, \`larek.apk\` — «Ларёк» (разреши установку из неизвестных источников).
          **Браузер:** \`index.html\` — змейка, \`larek.html\` — «Ларёк». Скачай и открой.

          Ветка: \`${{ github.ref_name }}\`, коммит ${{ github.sha }}." \
            --latest
