name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Package game
        run: |
          mkdir -p dist/snake-boom
          cp index.html README.md dist/snake-boom/
          cp android/app/build/outputs/apk/release/app-release.apk dist/snake-boom.apk
          cd dist && zip -r snake-boom.zip snake-boom

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-boom-web
          path: dist/snake-boom/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-boom-apk
          path: dist/snake-boom.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/snake-boom.apk dist/snake-boom.zip dist/snake-boom/index.html \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Змейка: Бабах — сборка #${{ github.run_number }}" \
            --notes "**Android:** скачай \`snake-boom.apk\` и установи (разреши установку из неизвестных источников).
          **Браузер:** скачай \`index.html\` и открой.

          Ветка: \`${{ github.ref_name }}\`, коммит ${{ github.sha }}." \
            --latest
