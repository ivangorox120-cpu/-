name: Fallout Droid

on:
  push:
    branches: ["**"]
    paths: ["fallout-droid/**", ".github/workflows/fallout-droid.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fallout-droid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK (prebuilt engine)
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PskipRust=true
      - uses: actions/upload-artifact@v4
        with:
          name: fallout-droid-apk
          path: fallout-droid/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fallout-droid-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk ../fallout-droid.apk
          gh release create "$TAG" ../fallout-droid.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Fallout Droid — сборка #${{ github.run_number }}" \
            --prerelease \
            --notes "Скачайте \`fallout-droid.apk\` и установите. Android 9+, arm64, Adreno 7xx/8xx (Snapdragon 8 Gen 1 и новее; Adreno 6xx — экспериментально).

          Первый запуск: «Играть» → установка рантайма (~3 ГБ) → вход в Steam для загрузки Proton Experimental. На Android 14+ включите «Disable child process restrictions» в параметрах разработчика.

          Telegram: https://t.me/rommy_apps

          Исходники (GPL-3.0): ветка \`${{ github.ref_name }}\`, коммит ${{ github.sha }}."
