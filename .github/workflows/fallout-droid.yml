name: Fallout Droid

on:
  push:
    branches: ["**"]
    paths: ["fallout-droid/**", ".github/workflows/fallout-droid.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fallout-droid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Build APK (prebuilt engine)
        # services.gradle.org иногда отваливается по таймауту: повторяем запуск.
        run: |
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --no-daemon --stacktrace -PskipRust=true && exit 0
            echo "attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: fallout-droid-apk
          path: fallout-droid/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fallout-droid-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk ../fallout-droid.apk
          gh release create "$TAG" ../fallout-droid.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Fallout Droid — сборка #${{ github.run_number }}" \
            --prerelease \
            --notes "Скачайте \`fallout-droid.apk\` и установите. Android 9+, arm64, Adreno 7xx/8xx (Snapdragon 8 Gen 1 и новее; Adreno 6xx — экспериментально).

          Первый запуск: «Подготовка к игре» → отключите ограничение дочерних процессов (параметры разработчика) → установите Linux-среду (~3 ГБ) → установите Proton. Затем «Играть».

          Telegram: https://t.me/rommy_apps

          Исходники (GPL-3.0): ветка \`${{ github.ref_name }}\`, коммит ${{ github.sha }}."
