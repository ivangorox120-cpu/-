plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snakeboom.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.snakeboom.game'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Две игры из одного проекта: каждая — свой APK со своим applicationId
    flavorDimensions 'game'
    productFlavors {
        snake {
            dimension 'game'
            applicationId 'com.snakeboom.game'
            resValue 'string', 'app_name', 'Змейка: Бабах'
            manifestPlaceholders = [orientation: 'unspecified']
        }
        larek {
            dimension 'game'
            applicationId 'com.larek.game'
            resValue 'string', 'app_name', 'Ларёк'
            manifestPlaceholders = [orientation: 'portrait'] // бизнес-экраны вертикальные
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // подписываем debug-ключом, чтобы APK ставился без лишней возни
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        snake.assets.srcDirs += "$buildDir/snakeAssets"
        larek.assets.srcDirs += "$buildDir/larekAssets"
    }
}

// Кладём игру в assets приложения: змейка — index.html из корня, ларёк — larek/index.html
def copySnake = tasks.register('copySnake', Copy) {
    from rootProject.file('../index.html')
    into "$buildDir/snakeAssets"
}
def copyLarek = tasks.register('copyLarek', Copy) {
    from rootProject.file('../larek/index.html')
    into "$buildDir/larekAssets"
}
preBuild.dependsOn copySnake, copyLarek
