<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1b22">
<title>Ларёк</title>
<style>
  :root {
    --bg:#0c0f10; --panel:rgba(14,18,19,.86); --panel2:rgba(24,29,30,.92); --line:#3a4344; --line2:#566062;
    --text:#e4e1d8; --muted:#8e9691; --acc:#d4a72c; --red:#c0392b; --green:#5f8f4e; --blue:#4d7ea8; --ink:#e4e1d8;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:var(--text); overflow:hidden;
    font-family: "Roboto Condensed", "Arial Narrow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select:none; user-select:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #world { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  #hud, #cross, #hint, #joy, #fade, #toast { pointer-events:none !important; }
  /* ---- HUD ---- */
  #hud { position:absolute; left:10px; top:max(10px, env(safe-area-inset-top)); max-width:calc(100% - 175px); font-family:"Courier New", monospace; font-size:12px; text-shadow:0 1px 2px #000; }
  .hrow { display:flex; flex-wrap:wrap; row-gap:2px; gap:10px; align-items:center; background:linear-gradient(90deg, rgba(10,13,14,.75), rgba(10,13,14,0)); padding:5px 20px 5px 9px;
    border-left:2px solid var(--acc); font-weight:700; letter-spacing:.5px; }
  .hrow .k { color:var(--muted); font-weight:400; }
  #reps { display:flex; gap:8px; margin-top:5px; padding-left:11px; }
  .rep { width:70px; font-size:9px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; }
  .rep .bar { height:3px; background:#ffffff22; position:relative; overflow:hidden; margin-top:2px; }
  .rep .bar i { position:absolute; top:0; bottom:0; }
  #topBtns { position:absolute; right:10px; top:max(10px, env(safe-area-inset-top)); display:flex; gap:6px; }
  .hbtn { background:var(--panel); border:1px solid var(--line2); color:var(--text); padding:8px 11px; font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .hbtn:active { background:#2a3132; }
  #cross { position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%; background:#fff; opacity:.75; box-shadow:0 0 0 1px #0008; }
  #hint { position:absolute; left:50%; top:62%; transform:translateX(-50%); font-size:13px; color:#fff; text-shadow:0 1px 3px #000; text-align:center; width:80%; opacity:.9; letter-spacing:.3px; }
  #joy { position:absolute; width:120px; height:120px; border-radius:50%; border:2px solid #ffffff55; background:#00000033; display:none; }
  #joy.on { display:block; }
  #knob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:#ffffff55; border:2px solid #fff9; }
  #joyHint { position:absolute; left:24px; bottom:calc(30px + env(safe-area-inset-bottom)); width:110px; height:110px; border-radius:50%; border:2px dashed #ffffff33; display:none;
    align-items:center; justify-content:center; font-size:10px; color:#fff8; text-align:center; letter-spacing:1px; pointer-events:none !important; }
  #joyHint.on { display:flex; }
  #actions { position:absolute; right:14px; bottom:calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .abtn { background:var(--panel); border:1px solid var(--acc); color:var(--text); padding:13px 18px; font-size:15px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); min-width:150px; text-align:center; }
  .abtn.sec { border-color:var(--line2); font-size:13px; padding:10px 14px; min-width:0; }
  .abtn:active { background:#2c2a1e; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; transition:opacity .25s; }
  /* ---- торговля ---- */
  #tradePanel { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(8px + env(safe-area-inset-bottom)); width:min(560px, calc(100% - 16px)); display:none; }
  #tradePanel.on { display:block; }
  @media (orientation: landscape) and (min-width: 600px) {
    #tradePanel { left:auto; right:8px; transform:none; width:330px; bottom:calc(8px + env(safe-area-inset-bottom)); }
    .acts { grid-template-columns:1fr 1fr 1fr; } .want { font-size:16px; }
  }
  .tp { background:var(--panel); border:1px solid var(--line); padding:10px 12px; }
  .timer { height:3px; background:#ffffff1a; margin:-10px -12px 8px; }
  .timer i { display:block; height:100%; background:var(--acc); }
  .bubble { position:relative; }
  .who { font-size:11px; color:var(--acc); font-weight:700; text-transform:uppercase; letter-spacing:1px; }
  .want { font-size:18px; font-weight:700; margin:3px 0; }
  .say { font-style:italic; font-size:14px; color:#cfcbc0; }
  .pat { height:3px; background:#ffffff1a; margin-top:6px; overflow:hidden; }
  .pat i { display:block; height:100%; background:var(--green); }
  .acts { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:6px; margin-top:8px; }
  .warn { color:#e8735a; font-weight:700; font-size:13px; }
  .tstat { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; font-family:"Courier New", monospace; }
  /* ---- блокнот ---- */
  #sheet { position:absolute; right:0; top:0; bottom:0; width:min(520px, 100%); background:var(--panel2); border-left:1px solid var(--line); display:none; flex-direction:column;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); padding-top:env(safe-area-inset-top); }
  #sheet.on { display:flex; }
  .sheetHead { display:flex; align-items:stretch; border-bottom:1px solid var(--line); flex:none; }
  #tabs { flex:1; display:flex; }
  #tabs button { flex:1; background:none; border:none; color:var(--muted); padding:9px 0 8px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid transparent; }
  #tabs button span { display:block; font-size:19px; }
  #tabs button.on { color:var(--acc); border-bottom-color:var(--acc); }
  #tabs button[disabled] { opacity:.3; }
  .sheetHead .hbtn { clip-path:none; border:none; border-left:1px solid var(--line); background:none; font-size:18px; }
  #screen { flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 14px 24px; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  h2 { font-size:17px; margin:6px 0 8px; text-transform:uppercase; letter-spacing:1.5px; }
  h3 { font-size:12px; margin:16px 0 6px; text-transform:uppercase; letter-spacing:1.5px; color:var(--acc); }
  .muted { color:var(--muted); font-size:12px; }
  .card { background:#ffffff08; border:1px solid var(--line); padding:10px; margin:8px 0; }
  .row { display:flex; align-items:center; gap:8px; }
  .row.sp { justify-content:space-between; }
  .btn { background:#1d2324; border:1px solid var(--line2); padding:8px 12px; font-weight:700; letter-spacing:.4px; color:var(--text); }
  .btn:active { background:#2f3738; }
  .btn[disabled] { opacity:.35; pointer-events:none; }
  .btn.red { background:#5a1f18; border-color:var(--red); } .btn.green { background:#2a3d22; border-color:var(--green); }
  .btn.yellow { background:#3d3215; border-color:var(--acc); } .btn.blue { background:#1d3346; border-color:var(--blue); }
  .btn.small { padding:5px 9px; font-size:12px; }
  .btn.big { width:100%; padding:13px; font-size:15px; text-transform:uppercase; letter-spacing:1px; }
  .chip { display:inline-block; font-size:10px; padding:1px 6px; background:#ffffff14; border:1px solid var(--line); margin-left:4px; text-transform:uppercase; letter-spacing:.5px; color:var(--text); }
  .vit { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
  .slot { background:#ffffff0a; border:1px solid var(--line); height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:24px; position:relative; padding:0; color:var(--text); }
  .slot small { font-size:10px; font-weight:700; color:var(--muted); max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 2px; }
  .slot b { position:absolute; top:2px; right:3px; font-size:10px; color:var(--acc); font-family:"Courier New", monospace; }
  .slot.empty { color:#5e6668; font-size:20px; border-style:dashed; }
  .slot.out { opacity:.4; }
  .slot.hot::after { content:"🔥"; position:absolute; top:1px; left:3px; font-size:12px; }
  .good { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #ffffff10; }
  .good .ic { font-size:24px; width:32px; text-align:center; }
  .good .nm { flex:1; min-width:0; font-size:13px; }
  .good .nm div:first-child { font-weight:700; }
  .good .pr { font-family:"Courier New", monospace; font-weight:700; text-align:right; font-size:14px; color:var(--acc); }
  .up { color:#e8735a; } .dn { color:#8fc27a; }
  .seg { display:flex; border:1px solid var(--line2); }
  .seg button { flex:1; border:none; background:transparent; padding:7px; font-weight:700; color:var(--muted); text-transform:uppercase; font-size:12px; letter-spacing:1px; }
  .seg button.on { background:var(--acc); color:#111; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .goal { border-left:2px solid var(--acc); }
  canvas.chart { width:100%; height:120px; display:block; background:#0b1214; border:1px solid var(--line); }
  .skill { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .skill .lv { font-family:"Courier New", monospace; font-weight:700; width:52px; color:var(--acc); }
  .cards { display:grid; grid-template-columns:repeat(8, 1fr); gap:3px; }
  .cards div { aspect-ratio:3/4; background:#ffffff08; display:flex; align-items:center; justify-content:center; font-size:14px; border:1px solid var(--line); color:var(--muted); }
  .cards div.got { background:linear-gradient(160deg,#7a5a1a,#c8902a); border-color:var(--acc); }
  /* ---- модалки ---- */
  #modal { position:absolute; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:20; padding:14px; }
  #modal.on { display:flex; }
  .mbox { background:var(--panel2); border:1px solid var(--line2); border-top:2px solid var(--acc); width:min(480px, 100%); max-height:92%; overflow-y:auto; padding:14px; touch-action:pan-y; }
  .mbox h2 { margin-top:0; }
  .mbox p { margin:8px 0; line-height:1.4; font-size:14px; }
  .mbtns { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
  .tv { background:#2a2019; padding:12px; border:1px solid #4a3a2a; }
  .tv .scr { background:#0e1a18; color:#cfe8d8; border-radius:24px/18px; padding:12px 14px; font-family:"Courier New", monospace; font-size:13px;
    min-height:140px; position:relative; overflow:hidden; box-shadow: inset 0 0 30px #000; }
  .tv .scr::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,#fff1 0 1px,#0000 1px 3px); pointer-events:none; }
  .tv .brand { color:#c8a46a; font:700 11px "Courier New", monospace; text-align:center; margin-top:6px; letter-spacing:4px; }
  .tv li { margin:5px 0; }
  .bills { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .bill { height:62px; border:1px solid #0006; position:relative; font-family:"Courier New", monospace; font-weight:700; color:#222;
    display:flex; flex-direction:column; justify-content:center; padding:0 8px; font-size:15px; overflow:hidden; }
  .bill small { font-size:8px; letter-spacing:.3px; }
  .bill .wm { position:absolute; right:8px; top:12px; width:28px; height:28px; border-radius:50%; background:#fff6; box-shadow:0 0 6px #fff8; }
  #toast { position:absolute; left:50%; top:25%; transform:translateX(-50%); z-index:30; display:flex; flex-direction:column; gap:5px; align-items:center; width:90%; }
  .tst { background:var(--panel); border-left:2px solid var(--acc); color:#fff; padding:7px 12px; font-size:13px; font-weight:700; animation: tin .25s ease-out; text-align:center; letter-spacing:.3px; }
  .tst.good { border-color:var(--green); } .tst.bad { border-color:var(--red); }
  @keyframes tin { from { opacity:0; transform:translateY(-8px) } }
  .float { position:absolute; left:50%; top:40%; font-weight:800; font-size:22px; color:#9fdc7a; pointer-events:none; z-index:25; animation: fup 1s ease-out forwards; text-shadow:0 1px 3px #000; font-family:"Courier New", monospace; }
  @keyframes fup { to { transform:translateY(-50px); opacity:0 } }
  /* ---- титул ---- */
  #title { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;
    background:radial-gradient(ellipse at center, #0000 30%, #000c 100%); }
  #title.on { display:flex; }
  #title h1 { font-family:"Arial Black", Impact, sans-serif; font-size:64px; margin:4px 0; letter-spacing:10px; color:var(--text); text-shadow:0 3px 0 #000, 0 0 30px #0008; }
  #title .y { font:700 13px "Courier New", monospace; letter-spacing:6px; color:var(--acc); }
  #title .mbtns { width:min(300px, 100%); }
  input[type=text] { font:inherit; font-size:16px; padding:9px; border:1px solid var(--line2); width:100%; background:#0c1011; color:var(--text); }
  .nogl { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); text-align:center; color:var(--muted); font-size:14px; width:80%; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="ui">
  <div id="hud"></div>
  <div id="topBtns"><button class="hbtn" data-a="sheet">📒 Блокнот</button><button class="hbtn" data-a="mute" id="muteBtn">🔊</button></div>
  <div id="cross"></div>
  <div id="hint"></div>
  <div id="joyHint">ДВИЖЕНИЕ</div>
  <div id="joy"><div id="knob"></div></div>
  <div id="actions"></div>
  <div id="tradePanel"></div>
  <div id="sheet"><div class="sheetHead"><nav id="tabs"></nav><button class="hbtn" data-a="closeSheet" id="closeSheet">✕</button></div><div id="screen"></div></div>
  <div id="title"></div>
  <div id="fade"></div>
  <div id="modal"><div class="mbox" id="mbox"></div></div>
  <div id="toast"></div>
</div>
<script src="three.min.js"></script>
<script>
(() => {
'use strict';

// ============================================================
//  Утилиты
// ============================================================
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function wpick(obj) {
  let tot = 0; for (const k in obj) tot += obj[k];
  let r = Math.random() * tot;
  for (const k in obj) { r -= obj[k]; if (r <= 0) return k; }
  return Object.keys(obj)[0];
}
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const yearOf = d => 1992 + Math.floor((d - 1) / 12);
const monthOf = d => (d - 1) % 12;
const dateStr = d => MONTHS[monthOf(d)] + ' ' + yearOf(d);
const LAST_STORY_DAY = 24;

// ============================================================
//  Данные
// ============================================================
// base — оптовая цена в рублях на январь 1992 (индекс цен = 1)
const GOODS = {
  gum:   { name:'Жвачка «Турбина»',       short:'Турбина',   icon:'🍬', base:15 },
  paper: { name:'Газета «Скорость-Инфо»', short:'Газета',    icon:'📰', base:12 },
  soda:  { name:'Лимонад «Буратинка»',    short:'Лимонад',   icon:'🥤', base:30, cold:true },
  choc:  { name:'Батончик «Сникерсон»',   short:'Сникерсон', icon:'🍫', base:45 },
  cig:   { name:'Сигареты «Космонавт»',   short:'Космонавт', icon:'🚬', base:40 },
  beer:  { name:'Пиво «Заводское»',       short:'Пиво',      icon:'🍺', base:55, cold:true },
  batt:  { name:'Батарейки «Энерджи»',    short:'Батарейки', icon:'🔋', base:70 },
  vodka: { name:'Спирт «Король»',         short:'«Король»',  icon:'🍾', base:260 },
  tape:  { name:'Кассета «Хиты-92»',      short:'Кассета',   icon:'📼', base:380 },
  toy:   { name:'Тамагочка',              short:'Тамагочка', icon:'🐣', base:900, from:13 },
};
const GOOD_IDS = Object.keys(GOODS);
const goodAvail = id => !GOODS[id].from || S.day >= GOODS[id].from;

const TYPES = {
  babka:   { name:'Бабушка',        wants:{paper:4, soda:2, choc:2, batt:1}, tol:.18, qty:[1,1], pat:9,  w:3 },
  school:  { name:'Школьник',       wants:{gum:5, soda:3, choc:3, toy:3},    tol:.35, qty:[1,3], pat:7,  w:3, young:true },
  worker:  { name:'Рабочий',        wants:{beer:4, cig:4, paper:1, batt:1},  tol:.45, qty:[1,3], pat:8,  w:4 },
  student: { name:'Студент',        wants:{tape:3, beer:2, gum:1, batt:2},   tol:.40, qty:[1,2], pat:8,  w:2, young:true },
  chelnok: { name:'Челнок',         wants:{cig:3, gum:2, batt:2, vodka:2},   tol:.15, qty:[4,8], pat:10, w:1.2 },
  newrus:  { name:'«Новый русский»',wants:{vodka:3, tape:2, cig:2, choc:1, toy:2}, tol:1.4, qty:[2,5], pat:6, w:.6 },
};

const OUTFITS = {
  none:     { name:'Старая куртка', usd:0,   icon:'🧥', desc:'Ничего особенного.' },
  sport:    { name:'Спортивный костюм и кепка', usd:15, icon:'🎽', desc:'Свой в районе: закупка −5%, «крыша» просит меньше.' },
  varenki:  { name:'Варёнки и кожанка', usd:30,  icon:'👖', desc:'Молодёжь платит охотнее (+15% к терпимости цены).' },
  raspberry:{ name:'Малиновый пиджак и цепь', usd:120, icon:'🥻', desc:'«Новые русские» ходят вдвое чаще и платят щедрее. Милиция просит больше.' },
  business: { name:'Деловой костюм', usd:90,  icon:'👔', desc:'Милиция заходит реже, проверки мягче.', from:13 },
};

const UPGRADES = {
  fridge:   { name:'Холодильник «Бирюса»', usd:40,  icon:'🧊', desc:'Холодные лимонад и пиво: покупатели готовы платить больше.' },
  alarm:    { name:'Сигнализация',         usd:50,  icon:'🚨', desc:'Ночью ларёк не обворуют.' },
  sign:     { name:'Неоновая вывеска',     usd:60,  icon:'💡', desc:'+25% покупателей.' },
  pavilion: { name:'Павильон',             usd:500, icon:'🏬', desc:'9 мест на витрине, склад 160, +20% покупателей.', from:13 },
};

const CARD_NAMES = ['Ламборджа','Феррано','Порше-911','Мерсо','БэМэВэ','Ауди-кватро','Тойота-Супра','Ниссан-Скай','Феррано F40','Додж-Вайпер',
  'Корветто','Мустанго','Ягуарро','Бентлей','Лотос','Альфа-Ромашка','Матра','Делорейн','Кадиллак-89','Шевроле-Камаро','Хонда-НСХ','Мазда-RX','Ситроен-СМ','Сааб-900'];

// ============================================================
//  Звук
// ============================================================
let actx = null;
function au() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, d, type = 'square', v = .08, slide = 0, delay = 0) {
  if (S && S.mute) return;
  const a = au(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  ching() { tone(1320, .08, 'square', .06); tone(1760, .25, 'triangle', .07, 0, .07); },
  click() { tone(600, .04, 'square', .04); },
  bad()   { tone(220, .22, 'sawtooth', .06, -90); },
  door()  { tone(880, .1, 'sine', .05); tone(660, .15, 'sine', .05, 0, .1); },
  coin()  { tone(980, .06, 'square', .05); tone(1470, .1, 'square', .04, 0, .05); },
  tv() {
    if (S && S.mute) return; const a = au(); if (!a) return;
    const len = a.sampleRate * .35, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) * .25;
    const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination); s.start();
  },
  fanfare() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'square', .05, 0, i * .12)); },
};

const chapter = () => S.day <= 12 ? 1 : 2;
const slotCount = () => S.up.pavilion ? 9 : 6;
const storeCap = () => S.up.pavilion ? 160 : 80;
const stockTotal = () => GOOD_IDS.reduce((a, id) => a + (S.stock[id] ? S.stock[id].q : 0), 0);
const qOf = id => S.stock[id] ? S.stock[id].q : 0;
const displayed = id => S.slots.includes(id);
const usdToRub = usd => Math.round(usd * S.rate);
const sellPrice = id => Math.max(1, Math.round(S.prices[id] * (1 + S.markup)));
const buyPrice = (id, src = S.src) => {
  let p = (src === 'station' ? S.vprices[id] : S.prices[id]);
  p *= 1 - .04 * S.sk.trade - (S.outfit === 'sport' ? .05 : 0) - (S.cheap > 0 ? .15 : 0);
  if (W && !W.nearMarket()) p *= 1.15; // доставка, если вы не на рынке
  return Math.max(1, Math.round(p));
};
const stockValue = () => GOOD_IDS.reduce((a, id) => a + qOf(id) * S.prices[id], 0);
const capitalUsd = () => S.usd + (S.money + stockValue() + S.pmp) / S.rate - S.debt;
const waveItem = () => (S.wave && S.day <= S.wave.until) ? S.wave.item : null;

function addStock(id, q, cost) {
  const st = S.stock[id] || (S.stock[id] = { q:0, c:0 });
  st.c = (st.c * st.q + cost * q) / (st.q + q); st.q += q;
}
function takeStock(id, q) {
  const st = S.stock[id]; if (!st) return 0;
  const n = Math.min(q, st.q); st.q -= n; return n * st.c;
}
function rep(k, d) { S.rep[k] = clamp(S.rep[k] + d, -100, 100); }

function genPrices() {
  S.prevPrices = { ...S.prices };
  const w = waveItem();
  for (const id of GOOD_IDS) {
    let p = GOODS[id].base * S.idx * R(.85, 1.2);
    if (id === w) p *= 1.5;
    S.prices[id] = Math.max(1, Math.round(p));
    const cheapAtStation = ['cig','vodka','beer','tape'].includes(id);
    S.vprices[id] = Math.max(1, Math.round(S.prices[id] * (cheapAtStation ? R(.65, .8) : R(1, 1.1))));
  }
}

function traffic() {

function makeCustomer() {
  const w = {};
  for (const k in TYPES) {
    let x = TYPES[k].w;
    if (k === 'newrus') x *= (chapter() === 2 ? 1.8 : 1) * (S.outfit === 'raspberry' ? 2.5 : 1);
    if (k === 'chelnok' && chapter() === 2) x *= 1.5;
    w[k] = x;
  }
  const k = wpick(w), ty = TYPES[k], wi = waveItem();
  const wants = {};
  for (const id in ty.wants) if (goodAvail(id)) wants[id] = ty.wants[id];
  if (wi) wants[wi] = (wants[wi] || 2) * 4;
  const item = wpick(wants);
  let qty = RI(ty.qty[0], ty.qty[1]); if (item === wi) qty += 1;
  let tol = ty.tol + S.sk.charm * .06 + S.rep.folk / 300;
  if (S.up.fridge && GOODS[item].cold) tol += .2;
  if (item === wi) tol += .8;
  if (ty.young && S.outfit === 'varenki') tol += .15;
  if (k === 'newrus' && S.outfit === 'raspberry') tol += .25;
  const wtp = S.prices[item] * (1 + tol) * R(.9, 1.15);
  const pat = ty.pat * (1 + .12 * S.sk.sense);
  return { k, name: ty.name, item, qty, wtp, pat, patMax: pat, price: sellPrice(item), disc: 0, refused: 0, said: pickGreeting(k), mood: 'neutral', anim: 0 };
}

function startTrade() {

function tradeTick(dt) {
  if (!T || T.paused || S.phase !== 'trade') return;
  T.t += dt;
  // особые
  for (const sp of T.specials) if (!sp.done && T.t >= sp.at && !T.cur) {
    sp.done = true; const v = specialVisitor(sp.k);
    if (v) { T.cur = v; sfx.door(); renderTrade(); return; }
  }
  // спавн
  T.nextSpawn -= dt;
  if (T.nextSpawn <= 0 && T.t < T.len - 4) {
    if (T.queue.length < 5) T.queue.push(makeCustomer());
    T.nextSpawn = R(1.6, 3.2) / traffic() * (T.boycott ? 1.8 : 1);
  }
  if (!T.cur && T.queue.length) { T.cur = T.queue.shift(); T.cur.anim = 0; sfx.door(); renderTrade(); }
  // терпение
  const c = T.cur;
  if (c && !c.special) {
    c.pat -= dt;
    const pb = document.getElementById('patBar'); if (pb) pb.style.width = clamp(c.pat / c.patMax * 100, 0, 100) + '%';
    if (c.pat <= 0) { T.lost++; c.said = 'Ну и ладно!'; leave(); }
  }
  // очередь тоже теряет терпение
  for (const q of T.queue) q.pat -= dt * .35;
  const before = T.queue.length; T.queue = T.queue.filter(q => q.pat > 0); T.lost += before - T.queue.length;
  const tb = document.getElementById('tBar'); if (tb) tb.style.width = clamp(100 - T.t / T.len * 100, 0, 100) + '%';
  if (T.t >= T.len && (!T.cur || !T.cur.special)) endTrade();
}

function act(a) {

  if (a === 'discount') {

  }
  if (a === 'sell') {

    if (r <= 1 || (r <= 1.12 && Math.random() < .35)) {
      if (Math.random() < (c.k === 'chelnok' ? .14 : .06) && c.price * st.n > usdToRub(1)) { fakeBillGame(c, st.n); return; }

function autoDay(hours) {
  let rev = 0, cogs = 0, sold = 0;
  const n = hours ? Math.round(hours * 4 * traffic()) : Math.round(26 * traffic());
  for (let i = 0; i < n; i++) {
    const c = makeCustomer(); const st = custStatus(c);
    if (!st.ok || Math.random() < .2) continue;
    if (c.price / c.wtp > 1) { c.price = Math.max(Math.round(S.prices[c.item] * .9), Math.round(c.wtp * .95)); }
    const cost = takeStock(c.item, st.n); rev += c.price * st.n; cogs += cost; sold += st.n;
  }

function advanceDay() {
  const prevDay = S.day;
  S.day++;
  // инфляция и курс
  const y = yearOf(S.day);
  let infl = y === 1992 ? R(.09, .16) : R(.06, .11);
  if (prevDay === 1) infl = R(.3, .4); // январский шок 92-го
  S.inflLast = infl;
  S.idx *= 1 + infl;
  let rateMove = infl + R(-.03, .04);
  // «Чёрный вторник» в свободном режиме (октябрь 1994)
  const blackTuesday = yearOf(S.day) === 1994 && monthOf(S.day) === 9;
  if (blackTuesday) rateMove += .35;
  S.rate = Math.round(S.rate * (1 + rateMove));
  S.rateHist.push(S.rate); if (S.rateHist.length > 30) S.rateHist.shift();
  // волны моды
  if (S.day === S.nextWaveDay) {
    S.wave = { item: S.flags.nextWaveItem, until: S.day + 2 };
    S.nextWaveDay = S.day + RI(4, 5); S.flags.nextWaveItem = null;
  }
  if (S.day + 1 === S.nextWaveDay) {
    const cand = ['tape','gum','soda','choc','batt','beer'].concat(S.day + 1 >= 13 ? ['toy','toy'] : []);
    S.flags.nextWaveItem = pick(cand.filter(c => !S.wave || c !== S.wave.item));
  }
  genPrices();
  if (S.cheap > 0) S.cheap--;
  // пирамида
  let pmpNews = null;
  if (S.pmp > 0 && !S.pmpDead) {
    if (S.day >= S.pmpCrashDay) { pmpNews = `Офис «ПМП» закрыт. Вкладчики стоят у дверей. Ваши ${fmt(S.pmp)} ₽ пропали.`; S.pmp = 0; S.pmpDead = true; }
    else S.pmp = Math.round(S.pmp * 1.3);
  } else if (!S.pmpDead && S.day >= S.pmpCrashDay) { S.pmpDead = true; pmpNews = 'Фонд «ПМП» лопнул. Хорошо, что вас там не было.'; }
  // ваучерный фонд
  let fundNews = null;
  if (S.voucher === 'fund' && S.day >= 18 && !S.fundGone) { S.fundGone = true; fundNews = 'Чековый фонд «Золотой телёнок» исчез вместе с офисом и ваучерами вкладчиков.'; }

  // новости
  const news = [];
  news.push(`Наступил ${MONTHS[monthOf(S.day)].toLowerCase()} ${yearOf(S.day)}-го. Цены за месяц выросли на ${Math.round(infl * 100)}%.`);
  news.push(`Курс доллара в обменниках: ${fmt(S.rate)} ₽.${blackTuesday ? ' ОБВАЛ РУБЛЯ! «Чёрный вторник»!' : ''}`);
  if (S.flags.nextWaveItem) news.push(`В Москве ажиотаж: все сметают «${GOODS[S.flags.nextWaveItem].short}». Скоро докатится и до нас!`);
  if (waveItem()) news.push(`Мода дня: «${GOODS[waveItem()].short}». Дефицит, цены на опте подскочили.`);
  if (pmpNews) news.push(pmpNews);
  if (fundNews) news.push(fundNews);
  if (!S.pmpDead && S.day >= 14 && S.day + 1 >= S.pmpCrashDay && Math.random() < .6 + .2 * S.sk.sense) news.push('Налоговая полиция заинтересовалась фондом «ПМП». Вкладчики волнуются.');
  if (yearOf(S.day) === 1994 && monthOf(S.day) === 8) news.push('Аналитики шепчутся: рубль перегрет, осенью возможны сюрпризы.');
  news.push(pick(['Краснозаводский завод снова задержал зарплату.', 'В ДК открылся видеосалон: «Терминатор-2» каждый вечер.', 'Синоптики обещают перемены погоды.',
    'Гороскоп от Глобы-младшего: Тельцам везёт в торговле.', 'На рынке поймали карманника. Будьте бдительны.', 'В городе открылся первый коммерческий банк «Красный капитал».',
    'Телемагазин: чудо-нож режет всё, даже консервную банку!', 'Депутаты горсовета спорят о новых налогах на ларьки.']));
  queueCard({ title:'📺 Новости', html:`<div class="tv"><div class="scr"><ul style="padding-left:18px;margin:0">${news.map(n => `<li>${n}</li>`).join('')}</ul></div><div class="brand">РУБИН</div></div>`,
    onShow: () => sfx.tv() });

function buy(id, n) {
  const src = (chapter() === 2 || S.free) && (!W || W.nearMarket()) ? S.src : 'market';
  const p = buyPrice(id, src);
  const space = storeCap() - stockTotal();
  n = Math.min(n, space, Math.floor(S.money / p));
  if (n <= 0) { toast(space <= 0 ? 'Склад забит!' : 'Не хватает денег', 'bad'); sfx.bad(); return; }
  S.money -= p * n;
  let got = n;
  if (src === 'station' && Math.random() < .2) { got = Math.max(0, n - Math.ceil(n * .4)); toast(`Брак! Годных только ${got} из ${n}`, 'bad'); }
  if (got > 0) addStock(id, got, p * n / got);
  if (id === 'gum') {
    S.gumBought += got;
    while (S.gumBought >= 10) {
      S.gumBought -= 10;
      const missing = CARD_NAMES.map((_, i) => i).filter(i => !S.cards.includes(i));
      if (missing.length && Math.random() < .7) { const c = pick(missing); S.cards.push(c); toast(`Вкладыш! «${CARD_NAMES[c]}» (${S.cards.length}/${CARD_NAMES.length})`, 'good'); if (S.cards.length === CARD_NAMES.length) { rep('folk', 10); toast('Полный альбом! Школьники в восторге. Народ +10', 'good'); } }
    }
  }
  sfx.coin(); render();
}

function drawChart() {
  const c = $('#chart'); if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr; const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const d = S.rateHist, mx = Math.max(...d) * 1.05, mn = Math.min(...d) * .95;
  g.strokeStyle = '#2f4a4a'; g.lineWidth = 1;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke(); }
  g.strokeStyle = '#7fe0a0'; g.lineWidth = 2; g.beginPath();
  d.forEach((v, i) => { const x = d.length === 1 ? w / 2 : 8 + i * (w - 16) / (d.length - 1), y = h - 10 - (v - mn) / (mx - mn || 1) * (h - 24); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.fillStyle = '#d6f0e0'; g.font = '700 12px "Courier New", monospace'; g.fillText('USD/RUB  ' + fmt(S.rate), 8, 16);
}
function usdOp(kind, n) {
  const buyRate = Math.round(S.rate * 1.04), sellRate = Math.round(S.rate * .96);
  if (kind === 'buy') {
    const k = n === 'all' ? Math.floor(S.money / buyRate) : Math.min(+n, Math.floor(S.money / buyRate));
    if (k <= 0) { toast('Не хватает рублей', 'bad'); return; }
    S.money -= k * buyRate; S.usd += k;
  } else {
    const k = n === 'all' ? S.usd : Math.min(+n, S.usd);
    if (k <= 0) { toast('Нет долларов', 'bad'); return; }
    S.usd -= k; S.money += k * sellRate;
  }
  sfx.coin(); render();
}

    setTimeout(() => fade(() => { if (S) S.flags.wentOut = true; P.inside = false; P.seated = false; P.x = .8; P.z = -KD - .9; P.yaw = 0; P.pitch = 0; setTimeout(() => doorTarget = 0, 300); }), 250);
  }
  function enterKiosk() {
    doorTarget = 1; sfx.door();
    setTimeout(() => fade(() => { P.inside = true; P.seated = false; P.x = .8; P.z = -KD + .55; P.yaw = Math.PI; P.pitch = 0; setTimeout(() => doorTarget = 0, 300); }), 250);
  }
  const distTo = (x, z) => Math.hypot(P.x - x, P.z - z);
  const nearMarket = () => !P.inside && distTo(MARKET.x, MARKET.z) < 15;
  const nearBooth = () => !P.inside && distTo(BOOTH.x, BOOTH.z + 1.6) < 2.6;
  const ray = new THREE.Raycaster(), center = new THREE.Vector2(0, 0);
  function lookingAtDoor(maxD) { ray.setFromCamera(center, camera); const h = ray.intersectObject(doorMesh, false)[0]; return h && h.distance < maxD; }
  function action() {
    if (!S || fading || cardOpen) return null;
    if (P.inside) {
      if (P.locked) return null;
      if (!P.seated && lookingAtDoor(2.3)) return { label: '🚪 Выйти', fn: exitKiosk };
      if (!P.seated && distTo(STOOL.x, STOOL.z) < 1.0) return { label: '🪑 Сесть за прилавок', fn: sit };
      return null;
    }
    if (lookingAtDoor(3) || distTo(.8, -KD - .6) < 1.2) return { label: '🚪 Войти в ларёк', fn: enterKiosk };
    if (nearBooth()) return { label: '💱 Обменник', fn: () => openSheet('exch') };
    if (nearMarket()) return { label: '🛒 Рынок', fn: () => openSheet('market') };
    return null;
  }

  // ---------- управление: взгляд + джойстик ----------
  const ptrs = new Map(); let joyId = null;
  const joyEl = $('#joy'), knob = $('#knob');
  cvs.addEventListener('pointerdown', e => {
    au();
    const inJoyZone = e.clientX < window.innerWidth * .45 && e.clientY > window.innerHeight * .4;
    if (inJoyZone && canMove() && joyId === null && e.pointerType !== 'mouse') {
      joyId = e.pointerId; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, ox: e.clientX, oy: e.clientY, joy: true });
      joyEl.style.left = (e.clientX - 60) + 'px'; joyEl.style.top = (e.clientY - 60) + 'px'; joyEl.classList.add('on');
    } else ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cvs.setPointerCapture(e.pointerId);
  });
  cvs.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    if (p.joy) {
      let dx = e.clientX - p.ox, dy = e.clientY - p.oy; const d = Math.hypot(dx, dy), mx = 50;
      if (d > mx) { dx *= mx / d; dy *= mx / d; }
      input.jx = dx / mx; input.jy = dy / mx; knob.style.transform = `translate(${dx}px,${dy}px)`;
    } else {
      const s = e.pointerType === 'mouse' ? .0035 : .0055;
      P.yaw -= (e.clientX - p.x) * s; P.pitch = clamp(P.pitch - (e.clientY - p.y) * s, -1.35, 1.25);
      p.x = e.clientX; p.y = e.clientY;
    }
  });
  const up = e => { const p = ptrs.get(e.pointerId); if (p && p.joy) { joyId = null; input.jx = input.jy = 0; knob.style.transform = ''; joyEl.classList.remove('on'); } ptrs.delete(e.pointerId); };
  cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => { input.keys[e.code] = true; if (e.code === 'KeyE') { const a = action(); if (a) a.fn(); } if (e.code === 'Space' && S && !P.locked) { P.seated ? stand() : null; } });
  window.addEventListener('keyup', e => { input.keys[e.code] = false; });

  // ---------- кадр ----------
  let tvT = 0, actT = 0, lastAct = '', t0 = 0;
  const mobileJoy = () => canMove();
  function frame(dt) {
    t0 += dt;
    // время суток
    if (!S) setTime(.82);
    else if (S.phase === 'trade' && T) setTime(.08 + .8 * clamp(T.t / T.len, 0, 1));
    else if (S.phase === 'evening') setTime(.93);
    else setTime(.1);
    setSeason();
    // движение
    if (canMove()) {
      let mx = input.jx, mz = input.jy; const k = input.keys;
      if (k.KeyW || k.ArrowUp) mz -= 1; if (k.KeyS || k.ArrowDown) mz += 1; if (k.KeyA || k.ArrowLeft) mx -= 1; if (k.KeyD || k.ArrowRight) mx += 1;
      const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; }
      const sp = (k.ShiftLeft ? 4.2 : 2.5) * (P.inside ? .6 : 1);
      const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
      const vx = (rx * mx - fx * mz) * sp * dt, vz = (rz * mx - fz * mz) * sp * dt;
      if (P.inside) { P.x = clamp(P.x + vx, -KW + .3, KW - .3); P.z = clamp(P.z + vz, -KD + .3, KD - .55); }
      else {
        let nx = P.x + vx; if (!hit(nx, P.z)) P.x = nx;
        let nz = P.z + vz; if (!hit(P.x, nz)) P.z = nz;
        P.x = clamp(P.x, -56, 66); P.z = clamp(P.z, -40, 18.5);
      }
      const moving = Math.abs(vx) + Math.abs(vz) > .0005; if (moving) P.bob += dt * 9 * Math.hypot(mx, mz);
    }
    if (P.seated && !fading) { P.x += (STOOL.x - P.x) * Math.min(1, dt * 6); P.z += (STOOL.z - P.z) * Math.min(1, dt * 6); }
    const targetH = P.seated ? 1.18 : 1.66; P.h += (targetH - P.h) * Math.min(1, dt * 5);
    camera.position.set(P.x, P.h + (P.seated ? 0 : Math.sin(P.bob) * .035), P.z);
    camera.rotation.set(P.pitch, P.yaw, 0);
    // дверь
    doorOpen += (doorTarget - doorOpen) * Math.min(1, dt * 6); doorPivot.rotation.y = -doorOpen * 1.6;
    // свет в ларьке: свечение лампочки чуть мерцает
    lamp.intensity = 5 + Math.sin(t0 * 31) * .08 + (Math.random() < .002 ? -2 : 0);
    // телевизор
    tvT += dt; if (tvT > .08) { tvT = 0; const g = tvTex.userData.canvas.getContext('2d'), id = g.createImageData(96, 72); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 200; id.data[i] = v * .9; id.data[i + 1] = v; id.data[i + 2] = v * 1.1; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); tvTex.needsUpdate = true; }
    // люди
    syncCustomers(dt);
    for (const n of peds) { const r = n.userData.route, [tx, tz] = r[n.userData.wp]; if (walkTo(n, tx, tz, dt, n.userData.sp)) n.userData.wp = (n.userData.wp + 1) % r.length; }
    vendors.forEach(v => animNPC(v, dt, false));
    // машины: тормозят перед игроком
    for (const c of traffic) {
      const ahead = (P.x - c.x) * c.dir, block = !P.inside && Math.abs(P.z - c.lane) < 1.6 && ahead > 0 && ahead < 9;
      c.v += ((block ? 0 : c.vmax) - c.v) * Math.min(1, dt * (block ? 3 : .8));
      c.x += c.v * c.dir * dt; if (c.x > 80) c.x = -70; if (c.x < -70) c.x = 80;
      c.m.position.set(c.x, 0, c.lane);
    }
    // снег вокруг камеры
    if (snowPts.visible) { const a = snowGeo.attributes.position.array; const ox = camera.position.x, oz = camera.position.z; for (let i = 0; i < snowN; i++) { a[i * 3 + 1] -= dt * (1 + (i % 5) * .2); a[i * 3] += Math.sin(t0 + i) * dt * .2; const wx = a[i * 3] + ox, wz = a[i * 3 + 2] + oz; if (a[i * 3 + 1] < 0 || (a[i * 3 + 1] < 2.7 && Math.abs(wx) < 1.6 && Math.abs(wz) < 1.3)) a[i * 3 + 1] = 14; } snowGeo.attributes.position.needsUpdate = true; snowPts.position.set(camera.position.x, 0, camera.position.z); }
    sky.position.copy(camera.position); skyMat.uniforms.t.value = t0;
    // контекстная кнопка
    actT -= dt; if (actT <= 0) { actT = .15; const a = action(), lbl = a ? a.label : ''; if (lbl !== lastAct) { lastAct = lbl; curAction = a; renderActions(); } else curAction = a; }
    // рендер
    post.uniforms.time.value = t0;
    renderer.setRenderTarget(rt); renderer.render(scene, camera);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  }
  setTime(.82);
  return { frame, updateShelves, goCounter, sit, stand, nearMarket, nearBooth, P, action, unlock() { P.locked = false; onCtl(); }, canMove, mobileJoy,
    reset() { P.x = STOOL.x; P.z = STOOL.z; P.yaw = Math.PI; P.pitch = -.08; P.seated = true; P.inside = true; P.locked = false; shelfSig = ''; season = -1; } };
})();

// ============================================================
//  Главный цикл
// ============================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (S) tradeTick(dt);
  if (W) { try { W.frame(dt); } catch (e) { console.error(e); } }
  requestAnimationFrame(loop);
}
if (!W) document.body.insertAdjacentHTML('beforeend', '');
render();
requestAnimationFrame(loop);
// для отладки/тестов
window.__larek = { get S() { return S; }, get T() { return T; }, W };
})();
</script>
