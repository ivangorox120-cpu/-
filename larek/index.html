<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1b22">
<title>Ларёк</title>
<style>
  :root {
    --bg:#0c0f10; --panel:rgba(14,18,19,.86); --panel2:rgba(24,29,30,.92); --line:#3a4344; --line2:#566062;
    --text:#e4e1d8; --muted:#8e9691; --acc:#d4a72c; --red:#c0392b; --green:#5f8f4e; --blue:#4d7ea8; --ink:#e4e1d8;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:var(--text); overflow:hidden;
    font-family: "Roboto Condensed", "Arial Narrow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select:none; user-select:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #world { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  #hud, #cross, #hint, #joy, #fade, #toast { pointer-events:none !important; }
  /* ---- HUD ---- */
  #hud { position:absolute; left:10px; top:max(10px, env(safe-area-inset-top)); max-width:calc(100% - 175px); font-family:"Courier New", monospace; font-size:12px; text-shadow:0 1px 2px #000; }
  .hrow { display:flex; flex-wrap:wrap; row-gap:2px; gap:10px; align-items:center; background:linear-gradient(90deg, rgba(10,13,14,.75), rgba(10,13,14,0)); padding:5px 20px 5px 9px;
    border-left:2px solid var(--acc); font-weight:700; letter-spacing:.5px; }
  .hrow .k { color:var(--muted); font-weight:400; }
  #reps { display:flex; gap:8px; margin-top:5px; padding-left:11px; }
  .rep { width:70px; font-size:9px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; }
  .rep .bar { height:3px; background:#ffffff22; position:relative; overflow:hidden; margin-top:2px; }
  .rep .bar i { position:absolute; top:0; bottom:0; }
  #topBtns { position:absolute; right:10px; top:max(10px, env(safe-area-inset-top)); display:flex; gap:6px; }
  .hbtn { background:var(--panel); border:1px solid var(--line2); color:var(--text); padding:8px 11px; font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .hbtn:active { background:#2a3132; }
  #cross.aim { width:2px; height:2px; margin:-1px 0 0 -1px; opacity:.95; box-shadow:0 0 0 1px #000a, 0 0 0 6px #ffffff22; }
  #cross { position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%; background:#fff; opacity:.75; box-shadow:0 0 0 1px #0008; }
  #hint { position:absolute; left:50%; top:24%; transform:translateX(-50%); font-size:13px; color:#fff; text-shadow:0 1px 3px #000; text-align:center; width:80%; opacity:.9; letter-spacing:.3px; }
  #joy { position:absolute; width:120px; height:120px; border-radius:50%; border:2px solid #ffffff55; background:#00000033; display:none; }
  #joy.on { display:block; }
  #knob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:#ffffff55; border:2px solid #fff9; }
  #joyHint { position:absolute; left:24px; bottom:calc(30px + env(safe-area-inset-bottom)); width:110px; height:110px; border-radius:50%; border:2px dashed #ffffff33; display:none;
    align-items:center; justify-content:center; font-size:10px; color:#fff8; text-align:center; letter-spacing:1px; pointer-events:none !important; }
  #joyHint.on { display:flex; }
  #actions { position:absolute; right:14px; bottom:calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .abtn { background:var(--panel); border:1px solid var(--acc); color:var(--text); padding:13px 18px; font-size:15px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); min-width:150px; text-align:center; }
  .abtn.sec { border-color:var(--line2); font-size:13px; padding:10px 14px; min-width:0; }
  .abtn:active { background:#2c2a1e; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; transition:opacity .25s; }
  /* ---- торговля ---- */
  #tradePanel { position:absolute; left:50%; transform:translateX(-50%); top:calc(58px + env(safe-area-inset-top)); width:min(520px, calc(100% - 16px)); display:none; z-index:6; }
  #tradePanel.on { display:block; }
  @media (orientation: landscape) and (max-height: 500px) {
    #tradePanel { top:52px; width:min(420px, 46%); left:auto; right:8px; transform:none; } .tp { padding:7px 10px; } .want { font-size:15px; } .say { font-size:13px; }
    .acts .btn { padding:6px 8px; }
  }
  .tp { background:var(--panel); border:1px solid var(--line); padding:10px 12px; }
  .timer { height:3px; background:#ffffff1a; margin:-10px -12px 8px; }
  .timer i { display:block; height:100%; background:var(--acc); }
  .bubble { position:relative; }
  .who { font-size:11px; color:var(--acc); font-weight:700; text-transform:uppercase; letter-spacing:1px; }
  .want { font-size:18px; font-weight:700; margin:3px 0; }
  .say { font-style:italic; font-size:14px; color:#cfcbc0; }
  .pat { height:3px; background:#ffffff1a; margin-top:6px; overflow:hidden; }
  .pat i { display:block; height:100%; background:var(--green); }
  .acts { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:6px; margin-top:8px; }
  .warn { color:#e8735a; font-weight:700; font-size:13px; }
  .tstat { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; font-family:"Courier New", monospace; }
  /* ---- блокнот ---- */
  #sheet { position:absolute; right:0; top:0; bottom:0; width:min(520px, 100%); background:var(--panel2); border-left:1px solid var(--line); display:none; flex-direction:column;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); padding-top:env(safe-area-inset-top); }
  #sheet.on { display:flex; }
  .sheetHead { display:flex; align-items:stretch; border-bottom:1px solid var(--line); flex:none; }
  #tabs { flex:1; display:flex; }
  #tabs button { flex:1; background:none; border:none; color:var(--muted); padding:9px 0 8px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid transparent; }
  #tabs button span { display:block; font-size:19px; }
  #tabs button.on { color:var(--acc); border-bottom-color:var(--acc); }
  #tabs button[disabled] { opacity:.3; }
  .sheetHead .hbtn { clip-path:none; border:none; border-left:1px solid var(--line); background:none; font-size:18px; }
  #screen { flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 14px 24px; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  h2 { font-size:17px; margin:6px 0 8px; text-transform:uppercase; letter-spacing:1.5px; }
  h3 { font-size:12px; margin:16px 0 6px; text-transform:uppercase; letter-spacing:1.5px; color:var(--acc); }
  .muted { color:var(--muted); font-size:12px; }
  .card { background:#ffffff08; border:1px solid var(--line); padding:10px; margin:8px 0; }
  .row { display:flex; align-items:center; gap:8px; }
  .row.sp { justify-content:space-between; }
  .btn { background:#1d2324; border:1px solid var(--line2); padding:8px 12px; font-weight:700; letter-spacing:.4px; color:var(--text); }
  .btn:active { background:#2f3738; }
  .btn[disabled] { opacity:.35; pointer-events:none; }
  .btn.red { background:#5a1f18; border-color:var(--red); } .btn.green { background:#2a3d22; border-color:var(--green); }
  .btn.yellow { background:#3d3215; border-color:var(--acc); } .btn.blue { background:#1d3346; border-color:var(--blue); }
  .btn.small { padding:5px 9px; font-size:12px; }
  .btn.big { width:100%; padding:13px; font-size:15px; text-transform:uppercase; letter-spacing:1px; }
  .chip { display:inline-block; font-size:10px; padding:1px 6px; background:#ffffff14; border:1px solid var(--line); margin-left:4px; text-transform:uppercase; letter-spacing:.5px; color:var(--text); }
  .vit { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
  .slot { background:#ffffff0a; border:1px solid var(--line); height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:24px; position:relative; padding:0; color:var(--text); }
  .slot small { font-size:10px; font-weight:700; color:var(--muted); max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 2px; }
  .slot b { position:absolute; top:2px; right:3px; font-size:10px; color:var(--acc); font-family:"Courier New", monospace; }
  .slot.empty { color:#5e6668; font-size:20px; border-style:dashed; }
  .slot.out { opacity:.4; }
  .slot.hot::after { content:"🔥"; position:absolute; top:1px; left:3px; font-size:12px; }
  .good { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #ffffff10; }
  .good .ic { font-size:24px; width:32px; text-align:center; }
  .good .nm { flex:1; min-width:0; font-size:13px; }
  .good .nm div:first-child { font-weight:700; }
  .good .pr { font-family:"Courier New", monospace; font-weight:700; text-align:right; font-size:14px; color:var(--acc); }
  .up { color:#e8735a; } .dn { color:#8fc27a; }
  .seg { display:flex; border:1px solid var(--line2); }
  .seg button { flex:1; border:none; background:transparent; padding:7px; font-weight:700; color:var(--muted); text-transform:uppercase; font-size:12px; letter-spacing:1px; }
  .seg button.on { background:var(--acc); color:#111; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .goal { border-left:2px solid var(--acc); }
  canvas.chart { width:100%; height:120px; display:block; background:#0b1214; border:1px solid var(--line); }
  .skill { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .skill .lv { font-family:"Courier New", monospace; font-weight:700; width:52px; color:var(--acc); }
  .cards { display:grid; grid-template-columns:repeat(8, 1fr); gap:3px; }
  .cards div { aspect-ratio:3/4; background:#ffffff08; display:flex; align-items:center; justify-content:center; font-size:14px; border:1px solid var(--line); color:var(--muted); }
  .cards div.got { background:linear-gradient(160deg,#7a5a1a,#c8902a); border-color:var(--acc); }
  /* ---- модалки ---- */
  #modal { position:absolute; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:20; padding:14px; }
  #modal.on { display:flex; }
  .mbox { background:var(--panel2); border:1px solid var(--line2); border-top:2px solid var(--acc); width:min(480px, 100%); max-height:92%; overflow-y:auto; padding:14px; touch-action:pan-y; }
  .mbox h2 { margin-top:0; }
  .mbox p { margin:8px 0; line-height:1.4; font-size:14px; }
  .mbtns { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
  .tv { background:#2a2019; padding:12px; border:1px solid #4a3a2a; }
  .tv .scr { background:#0e1a18; color:#cfe8d8; border-radius:24px/18px; padding:12px 14px; font-family:"Courier New", monospace; font-size:13px;
    min-height:140px; position:relative; overflow:hidden; box-shadow: inset 0 0 30px #000; }
  .tv .scr::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,#fff1 0 1px,#0000 1px 3px); pointer-events:none; }
  .tv .brand { color:#c8a46a; font:700 11px "Courier New", monospace; text-align:center; margin-top:6px; letter-spacing:4px; }
  .tv li { margin:5px 0; }
  .bills { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .bill { height:62px; border:1px solid #0006; position:relative; font-family:"Courier New", monospace; font-weight:700; color:#222;
    display:flex; flex-direction:column; justify-content:center; padding:0 8px; font-size:15px; overflow:hidden; }
  .bill small { font-size:8px; letter-spacing:.3px; }
  .bill .wm { position:absolute; right:8px; top:12px; width:28px; height:28px; border-radius:50%; background:#fff6; box-shadow:0 0 6px #fff8; }
  #subs { position:absolute; left:50%; bottom:17%; transform:translateX(-50%); z-index:31; max-width:80%; text-align:center; font:600 clamp(14px,2.3vw,20px)/1.35 system-ui,sans-serif; color:#f4f1e8; text-shadow:0 1px 3px #000,0 0 8px #000; pointer-events:none; opacity:0; transition:opacity .25s; }
  #subs.on { opacity:1; } #subs b { color:#e8c66a; font-weight:700; margin-right:.4em; } #subs .w { opacity:.0; transition:opacity .12s; } #subs .w.on { opacity:1; } #subs .w.cur { color:#fff; }
  #toast { position:absolute; left:50%; top:25%; transform:translateX(-50%); z-index:30; display:flex; flex-direction:column; gap:5px; align-items:center; width:90%; }
  .tst { background:var(--panel); border-left:2px solid var(--acc); color:#fff; padding:7px 12px; font-size:13px; font-weight:700; animation: tin .25s ease-out; text-align:center; letter-spacing:.3px; }
  .tst.good { border-color:var(--green); } .tst.bad { border-color:var(--red); }
  @keyframes tin { from { opacity:0; transform:translateY(-8px) } }
  .float { position:absolute; left:50%; top:40%; font-weight:800; font-size:22px; color:#9fdc7a; pointer-events:none; z-index:25; animation: fup 1s ease-out forwards; text-shadow:0 1px 3px #000; font-family:"Courier New", monospace; }
  @keyframes fup { to { transform:translateY(-50px); opacity:0 } }
  /* ---- титул ---- */
  #title { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;
    background:radial-gradient(ellipse at center, #0000 30%, #000c 100%); }
  #title.on { display:flex; }
  #title h1 { font-family:"Arial Black", Impact, sans-serif; font-size:64px; margin:4px 0; letter-spacing:10px; color:var(--text); text-shadow:0 3px 0 #000, 0 0 30px #0008; }
  #title .y { font:700 13px "Courier New", monospace; letter-spacing:6px; color:var(--acc); }
  #title .mbtns { width:min(300px, 100%); }
  input[type=text] { font:inherit; font-size:16px; padding:9px; border:1px solid var(--line2); width:100%; background:#0c1011; color:var(--text); }
  .nogl { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); text-align:center; color:var(--muted); font-size:14px; width:80%; }
  /* ---- экранное управление ---- */
  #ui > .ctl-layer { position:absolute; inset:0; pointer-events:none; z-index:4; }
  .ctl { position:absolute; pointer-events:auto; touch-action:none; -webkit-user-select:none; user-select:none; opacity:var(--op, .75); }
  .ctl::before { content:""; position:absolute; inset:var(--pad, 0px); border-radius:50%; background:rgba(14,18,19,.55); box-shadow:inset 0 0 0 2px rgba(255,255,255,.55); }
  .ctl-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; line-height:1.05; }
  .ctl-btn > span { position:relative; pointer-events:none; }
  .ctl-btn .ctl-ic { font-size:1.6em; } .ctl-btn .ctl-lb { font-size:.85em; font-weight:700; text-transform:uppercase; letter-spacing:.3px; max-width:100%; text-shadow:0 1px 2px #000; }
  .ctl-btn.down::before { background:rgba(212,167,44,.55); }
  .ctl-btn.on::before { box-shadow:inset 0 0 0 3px var(--acc); }
  .ctl.off { opacity:calc(var(--op, .75) * .35); }
  .ctl-stick::before { background:rgba(0,0,0,.25); box-shadow:inset 0 0 0 2px rgba(255,255,255,.4); }
  .ctl-knob { position:absolute; left:50%; top:50%; width:42%; height:42%; margin:-21% 0 0 -21%; border-radius:50%; background:rgba(255,255,255,.45); border:2px solid rgba(255,255,255,.8); pointer-events:none; }
  #ui > .ctl-layer.editing { pointer-events:auto; }
  .ctl-layer.editing { background:repeating-linear-gradient(0deg, #ffffff0c 0 1px, transparent 1px 5vh), repeating-linear-gradient(90deg, #ffffff0c 0 1px, transparent 1px 5vw); pointer-events:auto; }
  .ctl-layer.editing .ctl { outline:1px dashed #ffffff88; outline-offset:-1px; }
  .ctl-layer.editing .ctl.sel { outline:2px solid var(--acc); }
  .ctl-editor { position:absolute; left:50%; top:max(6px, env(safe-area-inset-top)); transform:translateX(-50%); width:min(760px, calc(100% - 12px)); z-index:12; display:none;
    background:var(--panel2); border:1px solid var(--acc); padding:8px; font-size:12px; max-height:46%; overflow:auto; pointer-events:auto; }
  .ctl-editor.on { display:block; }
  .ce-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0; }
  .ce-row label { display:flex; align-items:center; gap:4px; }
  .ce-row input[type=range] { width:110px; }
  .ce-row select, .ce-row button { background:#1d2324; color:var(--text); border:1px solid var(--line2); padding:5px 8px; font:inherit; font-size:12px; }
  .ce-row button.ce-ok { background:#2a3d22; border-color:var(--green); font-weight:700; } .ce-row button.ce-del { background:#5a1f18; border-color:var(--red); }
  .ce-hint { color:var(--muted); }
  /* ---- диалог ---- */
  #dialog { position:absolute; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); width:min(560px, calc(100% - 16px)); z-index:15; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  #dialog.on { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .dlg { background:var(--panel2); border:1px solid var(--line2); border-left:3px solid var(--acc); padding:12px 14px; }
  .dlg-name { color:var(--acc); font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:12px; }
  .dlg-text { font-size:16px; margin:6px 0 10px; min-height:22px; font-style:italic; }
  .dlg-opts { display:flex; flex-direction:column; gap:6px; } .dlg-opts .btn { text-align:left; }
  .setgrid { display:flex; flex-direction:column; gap:9px; } .setgrid label { display:flex; flex-wrap:wrap; align-items:center; gap:6px; justify-content:space-between; font-size:13px; }
  .setgrid input[type=range] { width:150px; } .setgrid select { background:#1d2324; color:var(--text); border:1px solid var(--line2); padding:4px 6px; }
  .ctl-img { width:1.9em; height:1.9em; display:block; margin:0 auto 1px; filter:drop-shadow(0 1px 1px #000); pointer-events:none; }
  /* ---- бумажный блокнот заказов (шрифт Kosmos — только здесь) ---- */
  @font-face { font-family:'Kosmos'; src:url('assets/fonts/kosmos.ttf') format('truetype'); font-display:swap; }
  #notepad { position:absolute; inset:0; z-index:14; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity .25s; perspective:1400px; }
  #notepad.on { opacity:1; pointer-events:auto; }
  /* блокнот на спирали (как на референсе): спираль сверху, светлая линованная бумага, тёмная обложка снизу, шапка с двойной линией */
  .np-book { position:relative; width:min(640px, 94vw, 118vh); height:min(74vh, 640px); margin-top:26px; transform:rotateX(9deg) rotateZ(-1.6deg); transform-style:preserve-3d; filter:drop-shadow(0 22px 26px #000b) drop-shadow(0 4px 6px #0007); }
  #notepad.enter .np-book { animation: npIn .4s cubic-bezier(.2,.8,.3,1); } /* только при доставании, не при каждом нажатии */
  @keyframes npIn { from { transform:rotateX(55deg) translateY(90px) scale(.7); opacity:0 } }
  .np-cover { position:absolute; left:10px; right:-10px; top:6px; bottom:-12px; background:linear-gradient(160deg, #2c2c2e, #19191b); border-radius:4px 6px 10px 8px; box-shadow:inset 0 0 0 1px #000, inset 0 -3px 0 #3a3a3c; }
  .np-stack { position:absolute; inset:0; background:#cfcfcd; border-radius:3px; box-shadow:2px 3px 0 #dcdcda, 4px 6px 0 #c9c9c7, 5px 8px 0 #bdbdbb; }
  .np-sheet { position:absolute; inset:0; border-radius:3px; overflow:hidden; }
  .np-page { position:absolute; inset:0; overflow:auto; padding:62px 26px 18px 30px; font-family:'Kosmos', 'Comic Sans MS', cursive; color:#1d2f7a; font-size:clamp(14px, 2.15vh, 19px); line-height:26px;
    background-color:#e9e9e6; background-image: repeating-linear-gradient(180deg, transparent 0 25px, #8fa8d6aa 25px 26px), radial-gradient(ellipse at 25% 15%, #f7f7f4 0, transparent 55%), radial-gradient(ellipse at 85% 95%, #d2d2ce 0, transparent 50%);
    background-position: 0 62px, 0 0, 0 0; background-attachment: local; box-shadow: inset 0 0 50px #9a9a9622; -webkit-user-select:none; user-select:none; touch-action:pan-y; }
  .np-page::before { content:""; position:absolute; left:22px; right:22px; top:40px; height:9px; border-top:3px solid #3a3a3c; border-bottom:2px solid #3a3a3c; }
  .np-label { position:absolute; right:24px; top:20px; font:900 13px Arial, sans-serif; letter-spacing:1.5px; color:#3a3a3c; }
  .np-rings { position:absolute; left:16px; right:16px; top:-22px; height:44px; display:flex; justify-content:space-between; pointer-events:none; z-index:3; }
  .np-rings i { position:relative; width:14px; height:40px; border:4px solid #1b1b1c; border-radius:9px; box-shadow: inset 2px 0 0 #55555a, 1px 1px 0 #000; transform:rotate(8deg); }
  .np-rings i::after { content:""; position:absolute; width:9px; height:9px; border-radius:50%; background:#8a8a86; box-shadow:inset 1px 1px 2px #000a; left:-1px; top:24px; }
  .np-cols { display:grid; grid-template-columns: 1.15fr .85fr; gap:18px; }

  .np-h2 { margin-top:6px; text-decoration:underline; }

  .np-cats button.on { text-decoration:underline wavy #7a1a1a; color:#7a1a1a; }
  .np-cats button.pencil, .np-pencilpage, .np-pencil { color:#5a5a62; }

  .np-ln { display:grid; grid-template-columns:1fr auto auto 22px; gap:6px; }

  .np-dim { color:#7a7a90; }
  .np-sum { margin-top:8px; border-top:1px solid #1d2f7a55; }
  .np-tot { font-size:1.2em; color:#7a1a1a; }
  .np-note { color:#a32a2a; transform:rotate(-1deg); margin-top:6px; }
  .np-cash { position:absolute; right:14px; bottom:6px; color:#3a4a2a; }
  .np-item { display:grid; grid-template-columns:1fr auto auto; gap:8px; } .np-pr { white-space:nowrap; } .np-item { align-items:center; border-bottom:1px dashed #1d2f7a33; }
  .np-q { display:flex; align-items:center; gap:4px; } .np-q span { min-width:28px; text-align:center; }

  .np-flip { position:absolute; inset:0; background:#e9e9e6 repeating-linear-gradient(180deg, transparent 0 25px, #8fa8d6aa 25px 26px); transform-origin:center top; backface-visibility:hidden; border-radius:3px; opacity:0; pointer-events:none; box-shadow:0 10px 24px #0005; z-index:2; }
