<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1b22">
<title>Ларёк</title>
<style>
  :root {
    --paper:#f3ead3; --grid:#cfdae4; --ink:#2b2a33; --muted:#7b7466; --red:#c8432f; --green:#4f7d5c;
    --yellow:#e6b43c; --blue:#3d6b8f; --dark:#1d1b22; --lcd:#9fb88a; --lcdInk:#25331f; --card:#fffaf0;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--dark); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #app { position:relative; max-width:480px; margin:0 auto; height:100%; display:flex; flex-direction:column;
    background-color:var(--paper);
    background-image: linear-gradient(90deg, transparent 22px, #e9a3a3 22px, #e9a3a3 24px, transparent 24px),
      linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 18px 18px, 18px 18px; }
  /* ---- HUD: пейджер ---- */
  #hud { background:#2a2830; padding:8px 10px 6px; color:#eee; flex:none; padding-top:max(8px, env(safe-area-inset-top)); }
  .lcd { background:var(--lcd); color:var(--lcdInk); border-radius:6px; padding:5px 8px; font-family:"Courier New", monospace;
    font-weight:700; display:flex; justify-content:space-between; gap:6px; font-size:14px; box-shadow: inset 0 2px 6px #0005; flex-wrap:wrap; }
  .lcd span { white-space:nowrap; }
  #reps { display:flex; gap:6px; margin-top:6px; }
  .rep { flex:1; font-size:10px; color:#bbb; }
  .rep .bar { height:5px; background:#444; border-radius:3px; position:relative; overflow:hidden; margin-top:2px; }
  .rep .bar i { position:absolute; top:0; bottom:0; left:50%; }
  /* ---- экраны ---- */
  #screen { flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 12px 14px 32px; -webkit-overflow-scrolling:touch; }
  h2 { font-family:"Courier New", monospace; font-size:19px; margin:6px 0 8px; }
  h3 { font-family:"Courier New", monospace; font-size:15px; margin:14px 0 6px; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1.5px solid #d9cdb0; border-radius:8px; padding:10px; margin:8px 0; box-shadow:0 2px 0 #d9cdb0; }
  .row { display:flex; align-items:center; gap:8px; }
  .row.sp { justify-content:space-between; }
  .btn { background:#fff; border:2px solid var(--ink); border-radius:8px; padding:8px 12px; font-weight:700; box-shadow:0 3px 0 var(--ink); }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .btn[disabled] { opacity:.4; pointer-events:none; }
  .btn.red { background:var(--red); color:#fff; } .btn.green { background:var(--green); color:#fff; }
  .btn.yellow { background:var(--yellow); } .btn.blue { background:var(--blue); color:#fff; }
  .btn.small { padding:5px 9px; font-size:13px; box-shadow:0 2px 0 var(--ink); }
  .btn.big { width:100%; padding:13px; font-size:17px; }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#eadfc4; margin-left:4px; }
  /* ---- сцена ---- */
  #sceneWrap { position:relative; margin:0 -12px 0 -32px; }
  #scene { display:block; width:100%; height:230px; touch-action:none; filter:saturate(.82) sepia(.12) contrast(1.05); }
  #sceneWrap::after { content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, #0000 0 2px, #0001 2px 3px); mix-blend-mode:multiply; }
  .rec { position:absolute; top:8px; left:10px; color:#fff; font:700 12px "Courier New", monospace; text-shadow:0 0 3px #000; z-index:2; pointer-events:none; }
  .timer { height:8px; background:#0003; margin:0 -12px 0 -32px; }
  .timer i { display:block; height:100%; background:linear-gradient(90deg, var(--yellow), var(--red)); }
  /* ---- покупатель ---- */
  #cust { min-height:150px; }
  .bubble { background:#fff; border:2px solid var(--ink); border-radius:12px; padding:9px 11px; position:relative; margin-top:8px; }
  .bubble::before { content:""; position:absolute; top:-10px; left:40px; border:8px solid transparent; border-bottom-color:var(--ink); border-top:0; }
  .who { font-size:12px; color:var(--muted); font-weight:700; }
  .want { font-size:17px; font-weight:700; margin:3px 0; }
  .say { font-style:italic; font-size:14px; }
  .pat { height:4px; background:#ddd; border-radius:2px; margin-top:6px; overflow:hidden; }
  .pat i { display:block; height:100%; background:var(--green); }
  .acts { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; margin-top:10px; }
  .acts.two { grid-template-columns:1fr 1fr; }
  .acts.one { grid-template-columns:1fr; }
  .warn { color:var(--red); font-weight:700; font-size:13px; }
  /* ---- витрина ---- */
  .vit { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; background:#8a6b4a; padding:7px; border-radius:6px;
    border:3px solid #5d4630; box-shadow: inset 0 0 0 2px #a8865f; }
  .slot { background:#e9f1f4; border-radius:4px; height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:26px; position:relative; border:none; padding:0; box-shadow: inset 0 0 12px #9ab4c044; }
  .slot small { font-size:10px; font-weight:700; color:#444; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 2px; }
  .slot b { position:absolute; top:2px; right:4px; font-size:11px; background:var(--ink); color:#fff; border-radius:8px; padding:0 5px; }
  .slot.empty { color:#9ab; font-size:22px; }
  .slot.out { opacity:.45; }
  .slot.hot::after { content:"🔥"; position:absolute; top:0; left:3px; font-size:13px; }
  /* ---- списки ---- */
  .good { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed #d1c4a5; }
  .good .ic { font-size:26px; width:34px; text-align:center; }
  .good .nm { flex:1; min-width:0; font-size:14px; }
  .good .nm div:first-child { font-weight:700; }
  .good .pr { font-family:"Courier New", monospace; font-weight:700; text-align:right; font-size:14px; }
  .up { color:var(--red); } .dn { color:var(--green); }
  .seg { display:flex; border:2px solid var(--ink); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:none; background:#fff; padding:7px; font-weight:700; }
  .seg button.on { background:var(--ink); color:#fff; }
  input[type=range] { width:100%; accent-color:var(--red); }
  /* ---- таб-бар ---- */
  #tabs { flex:none; display:flex; background:#2a2830; padding-bottom:env(safe-area-inset-bottom); }
  #tabs button { flex:1; background:none; border:none; color:#aaa; padding:8px 0 9px; font-size:11px; font-weight:700; }
  #tabs button span { display:block; font-size:21px; }
  #tabs button.on { color:var(--yellow); }
  #tabs button[disabled] { opacity:.3; }
  /* ---- модалки ---- */
  #modal { position:absolute; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:20; padding:14px; }
  #modal.on { display:flex; }
  .mbox { background:var(--card); border-radius:10px; border:3px solid var(--ink); width:100%; max-height:92%; overflow-y:auto; padding:14px; box-shadow:0 8px 0 #0006; }
  .mbox h2 { margin-top:0; }
  .mbox p { margin:8px 0; line-height:1.4; font-size:15px; }
  .mbtns { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .tv { background:#3b2f25; border-radius:18px; padding:14px; box-shadow: inset 0 0 0 4px #5a4636; }
  .tv .scr { background:#1b2a2a; color:#d6f0e0; border-radius:28px/22px; padding:14px 16px; font-family:"Courier New", monospace; font-size:14px;
    min-height:150px; position:relative; overflow:hidden; box-shadow: inset 0 0 30px #000; }
  .tv .scr::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,#fff1 0 1px,#0000 1px 3px); pointer-events:none; animation: roll 4s linear infinite; }
  @keyframes roll { from { background-position:0 0 } to { background-position:0 60px } }
  .tv .brand { color:#d9b77a; font:700 12px "Courier New", monospace; text-align:center; margin-top:8px; letter-spacing:4px; }
  .tv li { margin:6px 0; }
  .bills { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .bill { height:62px; border-radius:4px; border:1px solid #0004; position:relative; font-family:"Courier New", monospace; font-weight:700;
    display:flex; flex-direction:column; justify-content:center; padding:0 8px; font-size:15px; overflow:hidden; }
  .bill small { font-size:8px; letter-spacing:.3px; }
  .bill .wm { position:absolute; right:8px; top:12px; width:28px; height:28px; border-radius:50%; background:#fff6; box-shadow:0 0 6px #fff8; }
  #toast { position:absolute; left:50%; top:auto; bottom:90px; transform:translateX(-50%); z-index:30; display:flex; flex-direction:column; gap:5px; align-items:center; pointer-events:none; width:90%; }
  .tst { background:var(--ink); color:#fff; padding:7px 12px; border-radius:16px; font-size:14px; font-weight:700; animation: tin .25s ease-out; text-align:center; }
  .tst.good { background:var(--green); } .tst.bad { background:var(--red); }
  @keyframes tin { from { opacity:0; transform:translateY(-8px) } }
  .float { position:absolute; font-weight:800; font-size:20px; color:var(--green); pointer-events:none; z-index:25; animation: fup 1s ease-out forwards; text-shadow:0 1px 0 #fff; }
  @keyframes fup { to { transform:translateY(-50px); opacity:0 } }
  .skill { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .skill .lv { font-family:"Courier New", monospace; font-weight:700; width:52px; }
  .cards { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; }
  .cards div { aspect-ratio:3/4; border-radius:3px; background:#e3d8bd; display:flex; align-items:center; justify-content:center; font-size:16px; border:1px solid #cbbd99; }
  .cards div.got { background:linear-gradient(160deg,#ffe28a,#f29a3a); border-color:#c47b20; }
  .title { text-align:center; padding-top:20px; }
  .title h1 { font-family:"Courier New", monospace; font-size:46px; margin:10px 0 0; color:var(--red); text-shadow:3px 3px 0 var(--ink); letter-spacing:4px; }
  .title .y { font:700 16px "Courier New", monospace; letter-spacing:6px; }
  input[type=text] { font:inherit; font-size:17px; padding:9px; border:2px solid var(--ink); border-radius:8px; width:100%; background:#fff; }
  .goal { border-left:4px solid var(--red); padding-left:8px; }
  canvas.chart { width:100%; height:120px; display:block; background:#1b2a2a; border-radius:6px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="screen"></div>
  <nav id="tabs"></nav>
  <div id="modal"><div class="mbox" id="mbox"></div></div>
  <div id="toast"></div>
</div>
<script>
(() => {
'use strict';

// ============================================================
//  Утилиты
// ============================================================
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function wpick(obj) {
  let tot = 0; for (const k in obj) tot += obj[k];
  let r = Math.random() * tot;
  for (const k in obj) { r -= obj[k]; if (r <= 0) return k; }
  return Object.keys(obj)[0];
}
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const yearOf = d => 1992 + Math.floor((d - 1) / 12);
const monthOf = d => (d - 1) % 12;
const dateStr = d => MONTHS[monthOf(d)] + ' ' + yearOf(d);
const LAST_STORY_DAY = 24;

// ============================================================
//  Данные
// ============================================================
// base — оптовая цена в рублях на январь 1992 (индекс цен = 1)
const GOODS = {
  gum:   { name:'Жвачка «Турбина»',       short:'Турбина',   icon:'🍬', base:15 },
  paper: { name:'Газета «Скорость-Инфо»', short:'Газета',    icon:'📰', base:12 },
  soda:  { name:'Лимонад «Буратинка»',    short:'Лимонад',   icon:'🥤', base:30, cold:true },
  choc:  { name:'Батончик «Сникерсон»',   short:'Сникерсон', icon:'🍫', base:45 },
  cig:   { name:'Сигареты «Космонавт»',   short:'Космонавт', icon:'🚬', base:40 },
  beer:  { name:'Пиво «Заводское»',       short:'Пиво',      icon:'🍺', base:55, cold:true },
  batt:  { name:'Батарейки «Энерджи»',    short:'Батарейки', icon:'🔋', base:70 },
  vodka: { name:'Спирт «Король»',         short:'«Король»',  icon:'🍾', base:260 },
  tape:  { name:'Кассета «Хиты-92»',      short:'Кассета',   icon:'📼', base:380 },
  toy:   { name:'Тамагочка',              short:'Тамагочка', icon:'🐣', base:900, from:13 },
};
const GOOD_IDS = Object.keys(GOODS);
const goodAvail = id => !GOODS[id].from || S.day >= GOODS[id].from;

const TYPES = {
  babka:   { name:'Бабушка',        wants:{paper:4, soda:2, choc:2, batt:1}, tol:.18, qty:[1,1], pat:9,  w:3 },
  school:  { name:'Школьник',       wants:{gum:5, soda:3, choc:3, toy:3},    tol:.35, qty:[1,3], pat:7,  w:3, young:true },
  worker:  { name:'Рабочий',        wants:{beer:4, cig:4, paper:1, batt:1},  tol:.45, qty:[1,3], pat:8,  w:4 },
  student: { name:'Студент',        wants:{tape:3, beer:2, gum:1, batt:2},   tol:.40, qty:[1,2], pat:8,  w:2, young:true },
  chelnok: { name:'Челнок',         wants:{cig:3, gum:2, batt:2, vodka:2},   tol:.15, qty:[4,8], pat:10, w:1.2 },
  newrus:  { name:'«Новый русский»',wants:{vodka:3, tape:2, cig:2, choc:1, toy:2}, tol:1.4, qty:[2,5], pat:6, w:.6 },
};

const OUTFITS = {
  none:     { name:'Старая куртка', usd:0,   icon:'🧥', desc:'Ничего особенного.' },
  sport:    { name:'Спортивный костюм и кепка', usd:15, icon:'🎽', desc:'Свой в районе: закупка −5%, «крыша» просит меньше.' },
  varenki:  { name:'Варёнки и кожанка', usd:30,  icon:'👖', desc:'Молодёжь платит охотнее (+15% к терпимости цены).' },
  raspberry:{ name:'Малиновый пиджак и цепь', usd:120, icon:'🥻', desc:'«Новые русские» ходят вдвое чаще и платят щедрее. Милиция просит больше.' },
  business: { name:'Деловой костюм', usd:90,  icon:'👔', desc:'Милиция заходит реже, проверки мягче.', from:13 },
};

const UPGRADES = {
  fridge:   { name:'Холодильник «Бирюса»', usd:40,  icon:'🧊', desc:'Холодные лимонад и пиво: покупатели готовы платить больше.' },
  alarm:    { name:'Сигнализация',         usd:50,  icon:'🚨', desc:'Ночью ларёк не обворуют.' },
  sign:     { name:'Неоновая вывеска',     usd:60,  icon:'💡', desc:'+25% покупателей.' },
  pavilion: { name:'Павильон',             usd:500, icon:'🏬', desc:'9 мест на витрине, склад 160, +20% покупателей.', from:13 },
};

const CARD_NAMES = ['Ламборджа','Феррано','Порше-911','Мерсо','БэМэВэ','Ауди-кватро','Тойота-Супра','Ниссан-Скай','Феррано F40','Додж-Вайпер',
  'Корветто','Мустанго','Ягуарро','Бентлей','Лотос','Альфа-Ромашка','Матра','Делорейн','Кадиллак-89','Шевроле-Камаро','Хонда-НСХ','Мазда-RX','Ситроен-СМ','Сааб-900'];

// ============================================================
//  Звук
// ============================================================
let actx = null;
function au() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, d, type = 'square', v = .08, slide = 0, delay = 0) {
  if (S && S.mute) return;
  const a = au(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  ching() { tone(1320, .08, 'square', .06); tone(1760, .25, 'triangle', .07, 0, .07); },
  click() { tone(600, .04, 'square', .04); },
  bad()   { tone(220, .22, 'sawtooth', .06, -90); },
  door()  { tone(880, .1, 'sine', .05); tone(660, .15, 'sine', .05, 0, .1); },
  coin()  { tone(980, .06, 'square', .05); tone(1470, .1, 'square', .04, 0, .05); },
  tv() {
    if (S && S.mute) return; const a = au(); if (!a) return;
    const len = a.sampleRate * .35, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) * .25;
    const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination); s.start();
  },
  fanfare() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'square', .05, 0, i * .12)); },
};

// ============================================================
//  Состояние
// ============================================================
const SAVE_KEY = 'larek-save-v1';
let S = null;      // сохраняемое состояние
let T = null;      // торговый день (не сохраняется)
let tab = 'kiosk';

function newGame(name, sex) {
  S = {
    v:1, name, sex, day:1, phase:'morning', money:5000, usd:0, debt:120,
    idx:1, rate:110, rateHist:[110], prices:{}, prevPrices:{}, vprices:{}, stock:{}, slots:[null,null,null,null,null,null],
    markup:.4, rep:{street:0, law:0, folk:0}, sk:{trade:0, charm:0, sense:0}, sp:0, xp:0, lvl:0,
    outfit:'none', owned:['none'], up:{}, permit:false, seller:false, src:'market',
    wave:null, nextWaveDay:4, voucher:null, fundGone:false, pmp:0, pmpCrashDay:RI(18,21), pmpDead:false,
    cheap:0, fakeLoss:0, cards:[], gumBought:0, lastSeen:Date.now(), mute:false, free:false, ending:null,
    totalProfit:0, inflLast:0, flags:{},
  };
  genPrices();
  // наследство дяди
  addStock('gum', 20, S.prices.gum); addStock('soda', 10, S.prices.soda);
  addStock('paper', 15, S.prices.paper); addStock('cig', 10, S.prices.cig);
  S.slots = ['gum','soda','paper','cig',null,null];
}
function save() {
  if (!S) return;
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return null;
}

// ---- вычисляемые ----
const chapter = () => S.day <= 12 ? 1 : 2;
const slotCount = () => S.up.pavilion ? 9 : 6;
const storeCap = () => S.up.pavilion ? 160 : 80;
const stockTotal = () => GOOD_IDS.reduce((a, id) => a + (S.stock[id] ? S.stock[id].q : 0), 0);
const qOf = id => S.stock[id] ? S.stock[id].q : 0;
const displayed = id => S.slots.includes(id);
const usdToRub = usd => Math.round(usd * S.rate);
const sellPrice = id => Math.max(1, Math.round(S.prices[id] * (1 + S.markup)));
const buyPrice = (id, src = S.src) => {
  let p = (src === 'station' ? S.vprices[id] : S.prices[id]);
  p *= 1 - .04 * S.sk.trade - (S.outfit === 'sport' ? .05 : 0) - (S.cheap > 0 ? .15 : 0);
  return Math.max(1, Math.round(p));
};
const stockValue = () => GOOD_IDS.reduce((a, id) => a + qOf(id) * S.prices[id], 0);
const capitalUsd = () => S.usd + (S.money + stockValue() + S.pmp) / S.rate - S.debt;
const waveItem = () => (S.wave && S.day <= S.wave.until) ? S.wave.item : null;

function addStock(id, q, cost) {
  const st = S.stock[id] || (S.stock[id] = { q:0, c:0 });
  st.c = (st.c * st.q + cost * q) / (st.q + q); st.q += q;
}
function takeStock(id, q) {
  const st = S.stock[id]; if (!st) return 0;
  const n = Math.min(q, st.q); st.q -= n; return n * st.c;
}
function rep(k, d) { S.rep[k] = clamp(S.rep[k] + d, -100, 100); }

function genPrices() {
  S.prevPrices = { ...S.prices };
  const w = waveItem();
  for (const id of GOOD_IDS) {
    let p = GOODS[id].base * S.idx * R(.85, 1.2);
    if (id === w) p *= 1.5;
    S.prices[id] = Math.max(1, Math.round(p));
    const cheapAtStation = ['cig','vodka','beer','tape'].includes(id);
    S.vprices[id] = Math.max(1, Math.round(S.prices[id] * (cheapAtStation ? R(.65, .8) : R(1, 1.1))));
  }
}

function lerpC(a, b, t) {

}

let animT = 0;
function drawScene(dt) {
  if (!cx || !document.body.contains(cv)) return;
  animT += dt;
  const c = cx, w = CW, h = CH;
  const p = (S.phase === 'trade' && T) ? clamp(T.t / T.len, 0, 1) : .05;
  const m = monthOf(S.day), winter = m === 11 || m <= 1, autumn = m >= 9 && m <= 10;
  // небо
  const top = p < .6 ? lerpC('8fb3c9', 'c9a27c', p / .6) : lerpC('c9a27c', '3a3550', (p - .6) / .4);
  const bot = p < .6 ? lerpC('dfe6dc', 'f0b27a', p / .6) : lerpC('f0b27a', '6a4a5a', (p - .6) / .4);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, top); g.addColorStop(1, bot);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // панельки
  const horizon = h * .62;
  for (const b of buildings) {
    c.fillStyle = b.c; c.fillRect(b.x, horizon - b.h, b.w, b.h);
    for (let yy = horizon - b.h + 8; yy < horizon - 8; yy += 13) for (let xx = b.x + 6; xx < b.x + b.w - 8; xx += 12) {
      const lit = p > .65 && ((xx * 7 + yy * 3 + b.seed * 100) % 10) > 4;
      c.fillStyle = lit ? '#f6d77a' : '#6e7a80'; c.fillRect(xx, yy, 6, 7);
    }
  }
  // асфальт, бордюр, остановка
  c.fillStyle = winter ? '#e9eef0' : '#77756f'; c.fillRect(0, horizon, w, h - horizon);
  c.fillStyle = '#9a978f'; c.fillRect(0, horizon, w, 5);
  c.fillStyle = '#555'; c.fillRect(w - 46, horizon - 70, 4, 70);
  c.fillStyle = '#e6c84a'; c.beginPath(); c.arc(w - 44, horizon - 74, 12, 0, 7); c.fill();
  c.fillStyle = '#333'; c.font = '700 13px sans-serif'; c.textAlign = 'center'; c.fillText('А', w - 44, horizon - 69);
  // очередь
  if (S.phase === 'trade' && T) {
    T.queue.slice(0, 4).forEach((q, i) => {
      const L = LOOKS[q.k] || LOOKS.worker;
      drawPerson(c, w * .18 + i * 46, horizon + 32, .42, L, 'neutral', animT + i);
    });
    const cur = T.cur;
    if (cur) {
      cur.anim = Math.min(1, (cur.anim || 0) + dt * 3);
      const L = LOOKS[cur.k] || LOOKS.worker;
      const x = w * .5 - (1 - cur.anim) * w * .6;
      drawPerson(c, x, h - 34, 1.05, L, cur.mood || 'neutral', animT);
    }
  } else {
    // утро: случайный прохожий-герой у ларька
    drawPerson(c, w * .5, h - 34, 1.05, heroLook(), 'happy', animT);
  }
  // осадки
  if (winter || autumn) {
    c.fillStyle = winter ? '#fff' : '#9ab6d0';
    for (const f of snow) {
      f.y += f.v * dt * (winter ? 1 : 6); f.x += Math.sin(animT + f.r) * dt * 8;
      if (f.y > h) { f.y = -5; f.x = R(0, w); }
      if (winter) { c.beginPath(); c.arc(f.x, f.y, f.r, 0, 7); c.fill(); }
      else c.fillRect(f.x, f.y, 1, 7);
    }
  }
  // рама окошка ларька
  c.fillStyle = '#3e6b4f';
  c.fillRect(0, 0, w, 16); c.fillRect(0, 0, 14, h); c.fillRect(w - 14, 0, 14, h);
  c.fillStyle = '#2d5039'; c.fillRect(w / 2 - 3, 16, 6, h * .45);
  c.fillStyle = '#ffffff22'; c.beginPath(); c.moveTo(30, 20); c.lineTo(80, 20); c.lineTo(30, 90); c.fill();
  // подоконник-прилавок
  c.fillStyle = '#8a6b4a'; c.fillRect(0, h - 34, w, 34);
  c.fillStyle = '#a8865f'; c.fillRect(0, h - 34, w, 6);
  c.fillStyle = '#5d4630'; rr(c, w / 2 - 50, h - 26, 100, 18, 6); c.fill(); // окошко для денег
  c.fillStyle = '#e8d9b0'; c.font = '700 10px "Courier New", monospace'; c.fillText('ДЕНЬГИ СЮДА', w / 2, h - 13);
  // заклёпки
  c.fillStyle = '#27452f';
  for (let yy = 26; yy < h - 40; yy += 30) { c.beginPath(); c.arc(7, yy, 2, 0, 7); c.arc(w - 7, yy, 2, 0, 7); c.fill(); }
}

// свайп по сцене = торг; тап = продать
let swipeBound = null;
function bindSwipe() {
  if (swipeBound === cv) return; swipeBound = cv;
  let sx = 0, sy = 0, st = 0;
  cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
  cv.addEventListener('pointerup', e => {
    if (S.phase !== 'trade' || !T || !T.cur || T.paused || T.cur.special) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) act('discount');
    else if (Math.hypot(dx, dy) < 12 && performance.now() - st < 400) act('sell');
  });
}

let cards = [], cardOpen = false;

function nextCard() {
  const c = cards.shift();
  if (!c) { cardOpen = false; $('#modal').classList.remove('on'); if (T) T.paused = false; render(); return; }
  cardOpen = true; if (T) T.paused = true;
  const box = $('#mbox');
  box.innerHTML = (c.title ? `<h2>${c.title}</h2>` : '') + c.html +
    `<div class="mbtns">${(c.buttons || [{ label:'Дальше' }]).map((b, i) => `<button class="btn ${b.cls || ''}" data-card="${i}" ${b.disabled ? 'disabled' : ''}>${b.label}</button>`).join('')}</div>`;
  box.querySelectorAll('[data-card]').forEach(el => el.onclick = () => {
    sfx.click();
    const b = (c.buttons || [{}])[+el.dataset.card];
    const keep = b.fn ? b.fn() : null;
    if (keep !== 'keep') nextCard();
  });
  $('#modal').classList.add('on');
  if (c.onShow) c.onShow(box);
}

function traffic() {
  return (1 + (S.up.sign ? .25 : 0) + (S.up.pavilion ? .2 : 0)) * (1 + S.rep.folk / 250);
}
function makeCustomer() {
  const w = {};
  for (const k in TYPES) {
    let x = TYPES[k].w;
    if (k === 'newrus') x *= (chapter() === 2 ? 1.8 : 1) * (S.outfit === 'raspberry' ? 2.5 : 1);
    if (k === 'chelnok' && chapter() === 2) x *= 1.5;
    w[k] = x;
  }
  const k = wpick(w), ty = TYPES[k], wi = waveItem();
  const wants = {};
  for (const id in ty.wants) if (goodAvail(id)) wants[id] = ty.wants[id];
  if (wi) wants[wi] = (wants[wi] || 2) * 4;
  const item = wpick(wants);
  let qty = RI(ty.qty[0], ty.qty[1]); if (item === wi) qty += 1;
  let tol = ty.tol + S.sk.charm * .06 + S.rep.folk / 300;
  if (S.up.fridge && GOODS[item].cold) tol += .2;
  if (item === wi) tol += .8;
  if (ty.young && S.outfit === 'varenki') tol += .15;
  if (k === 'newrus' && S.outfit === 'raspberry') tol += .25;
  const wtp = S.prices[item] * (1 + tol) * R(.9, 1.15);
  const pat = ty.pat * (1 + .12 * S.sk.sense);
  return { k, name: ty.name, item, qty, wtp, pat, patMax: pat, price: sellPrice(item), disc: 0, refused: 0, said: pickGreeting(k), mood: 'neutral', anim: 0 };
}

    worker: ['Здорово, хозяин.', 'После смены — святое.', 'Зарплату опять не дали...'],
    student: ['Привет! Есть чё новенькое?', 'Стипуха пришла!', 'Слышал, новый альбом вышел?'],

    newrus: ['Слышь, братан, давай лучшее.', 'Сдачи не надо. Шучу. Надо.', 'Мне по-быстрому, у меня стрелка.'],

function startTrade() {

      opts: [

        { label:'Отказать', fn() { rep('folk', -3); toast('Тётя Валя обиделась. Народ −3', 'bad'); } },

      said:'Спекулянт! Мы всем расскажем, какие у тебя цены! Не ходите сюда, люди!',
      opts: [
        { label:'Извиниться и скинуть цены (наценка 20%)', cls:'green', fn() { S.markup = Math.min(S.markup, .2); rep('folk', 6); toast('Бабушки смягчились. Народ +6', 'good'); } },
        { label:'Не обращать внимания', fn() { rep('folk', -4); T.boycott = true; toast('Покупателей сегодня будет меньше', 'bad'); } },
      ] };
  }
  return null;
}
function tradeTick(dt) {
  if (!T || T.paused || S.phase !== 'trade') return;
  T.t += dt;
  // особые
  for (const sp of T.specials) if (!sp.done && T.t >= sp.at && !T.cur) {
    sp.done = true; const v = specialVisitor(sp.k);
    if (v) { T.cur = v; sfx.door(); renderTrade(); return; }
  }
  // спавн
  T.nextSpawn -= dt;
  if (T.nextSpawn <= 0 && T.t < T.len - 4) {
    if (T.queue.length < 5) T.queue.push(makeCustomer());
    T.nextSpawn = R(1.6, 3.2) / traffic() * (T.boycott ? 1.8 : 1);
  }
  if (!T.cur && T.queue.length) { T.cur = T.queue.shift(); T.cur.anim = 0; sfx.door(); renderTrade(); }
  // терпение
  const c = T.cur;
  if (c && !c.special) {
    c.pat -= dt;
    const pb = document.getElementById('patBar'); if (pb) pb.style.width = clamp(c.pat / c.patMax * 100, 0, 100) + '%';
    if (c.pat <= 0) { T.lost++; c.said = 'Ну и ладно!'; leave(); }
  }
  // очередь тоже теряет терпение
  for (const q of T.queue) q.pat -= dt * .35;
  const before = T.queue.length; T.queue = T.queue.filter(q => q.pat > 0); T.lost += before - T.queue.length;
  const tb = document.getElementById('tBar'); if (tb) tb.style.width = clamp(100 - T.t / T.len * 100, 0, 100) + '%';
  if (T.t >= T.len && (!T.cur || !T.cur.special)) endTrade();
}
function leave() { T.cur = null; renderTrade(); }
function custStatus(c) {
  const id = c.item, q = qOf(id), onVit = displayed(id);
  if (!onVit && q > 0) return { ok:false, msg:'Есть на складе, но нет на витрине! Положите на витрину.' };
  if (!onVit || q === 0) return { ok:false, msg:'Такого нет.' };
  return { ok:true, n: Math.min(q, c.qty), msg: q < c.qty ? `Есть только ${q} из ${c.qty}` : '' };
}

}

function renderTrade() {

}
function act(a) {
  const c = T && T.cur; if (!c || c.special || T.paused) return;
  if (a === 'next') { T.lost++; c.said = 'Эх...'; sfx.click(); leave(); return; }
  const st = custStatus(c); if (!st.ok) return;
  if (a === 'discount') {
    const floor = Math.round(S.prices[c.item] * .7);
    c.price = Math.max(floor, Math.round(c.price * .9)); c.disc++;
    c.pat -= c.patMax * .12;
    c.said = c.price / c.wtp <= 1 ? 'О, другое дело!' : pick(['Всё равно дорого...', 'Ещё скинь!', 'Да ну, у метро дешевле.']);
    sfx.click(); renderTrade(); return;
  }
  if (a === 'sell') {
    const r = c.price / c.wtp;
    if (r <= 1 || (r <= 1.12 && Math.random() < .35)) {
      if (Math.random() < (c.k === 'chelnok' ? .14 : .06) && c.price * st.n > usdToRub(1)) { fakeBillGame(c, st.n); return; }
      completeSale(c, st.n);
    } else {
      c.refused++; c.pat -= c.patMax * .3;
      c.said = pick(['Сколько?! Совсем обалдели!', 'Дорого! Скинь чуток.', 'За такие деньги я в Польшу съезжу.']);
      if (r > 1.4 && c.refused === 1) rep('folk', -1);
      sfx.bad(); renderTrade();
    }
  }
}
function completeSale(c, n, fake = false) {
  const sum = c.price * n;
  const cost = takeStock(c.item, n);
  S.money += sum; T.rev += sum; T.cogs += cost; T.sold += n;
  if (fake) S.fakeLoss += sum;
  S.xp += n;
  if (c.price / c.wtp < .7) rep('folk', .4);
  floatText('+' + fmt(sum) + ' ₽');
  sfx.ching();
  c.said = pick(['Спасибо!', 'Бывай!', 'Ещё зайду.', 'Нормально.']);
  checkLevel();
  leave();
}
function fakeBillGame(c, n) {

// тётя Люба торгует сама
function autoDay(hours) {
  let rev = 0, cogs = 0, sold = 0;
  const n = hours ? Math.round(hours * 4 * traffic()) : Math.round(26 * traffic());
  for (let i = 0; i < n; i++) {
    const c = makeCustomer(); const st = custStatus(c);
    if (!st.ok || Math.random() < .2) continue;
    if (c.price / c.wtp > 1) { c.price = Math.max(Math.round(S.prices[c.item] * .9), Math.round(c.wtp * .95)); }
    const cost = takeStock(c.item, st.n); rev += c.price * st.n; cogs += cost; sold += st.n;
  }
  const theft = Math.round(rev * R(0, .12));
  S.money += rev - theft;
  return { rev, cogs, sold, lost:0, theft };
}

    const trend = pp ? (S.prices[id] > pp * 1.02 ? '<span class="up">▲</span>' : S.prices[id] < pp * .98 ? '<span class="dn">▼</span>' : '') : '';
    return `<div class="good"><div class="ic">${GOODS[id].icon}</div><div class="nm"><div>${GOODS[id].name}${waveItem() === id ? ' 🔥' : ''}</div>
      <div class="muted">у вас ${qOf(id)}${S.stock[id] && S.stock[id].q ? ' · ср. цена ' + fmt(S.stock[id].c) : ''}</div></div>
      <div><div class="pr">${fmt(p)} ₽ ${trend}</div><div class="row" style="gap:4px;margin-top:3px">
        <button class="btn small" data-buy="${id}" data-n="1" ${trade ? 'disabled' : ''}>+1</button>
        <button class="btn small" data-buy="${id}" data-n="5" ${trade ? 'disabled' : ''}>+5</button>
        <button class="btn small" data-buy="${id}" data-n="10" ${trade ? 'disabled' : ''}>+10</button></div></div></div>`;
  }).join('');
  const outfits = Object.entries(OUTFITS).filter(([k, o]) => !o.from || S.day >= o.from).map(([k, o]) => {
    const owned = S.owned.includes(k), on = S.outfit === k;
    return `<div class="good"><div class="ic">${o.icon}</div><div class="nm"><div>${o.name}</div><div class="muted">${o.desc}</div></div>
      ${on ? '<span class="chip">надето</span>' : owned ? `<button class="btn small" data-wear="${k}">Надеть</button>`
        : `<button class="btn small yellow" data-outfit="${k}" ${S.money < usdToRub(o.usd) || trade ? 'disabled' : ''}>${fmt(usdToRub(o.usd))} ₽</button>`}</div>`;
  }).join('');
  return `<h2>🛒 ${src === 'station' ? 'Вокзальный рынок' : 'Оптовый рынок'}</h2>
    ${trade ? '<p class="warn">Рынок работает только утром.</p>' : ''}
    ${ch2 ? `<div class="seg"><button data-src="market" class="${src === 'market' ? 'on' : ''}">Оптовый</button><button data-src="station" class="${src === 'station' ? 'on' : ''}">Вокзал</button></div>
      ${src === 'station' ? '<p class="muted">Дешевле табак, спиртное и кассеты. Но каждая пятая партия — с браком.</p>' : ''}` : ''}
    ${S.cheap > 0 ? '<p class="dn"><b>Скидка от Ашота: −15% (ещё ' + S.cheap + ' дн.)</b></p>' : ''}
    <p class="muted">Склад: ${stockTotal()}/${storeCap()} · Касса: ${fmt(S.money)} ₽</p>
    <div class="card">${rows}</div>
    <h3>👕 Вещевой рынок</h3>
    <p class="muted">Одежда — это пропуск: по ней встречают.</p>
    <div class="card">${outfits}</div>`;
}
function buy(id, n) {
  const src = (chapter() === 2 || S.free) ? S.src : 'market';
  const p = buyPrice(id, src);
  const space = storeCap() - stockTotal();
  n = Math.min(n, space, Math.floor(S.money / p));
  if (n <= 0) { toast(space <= 0 ? 'Склад забит!' : 'Не хватает денег', 'bad'); sfx.bad(); return; }
  S.money -= p * n;
  let got = n;
  if (src === 'station' && Math.random() < .2) { got = Math.max(0, n - Math.ceil(n * .4)); toast(`Брак! Годных только ${got} из ${n}`, 'bad'); }
  if (got > 0) addStock(id, got, p * n / got);
  if (id === 'gum') {
    S.gumBought += got;
    while (S.gumBought >= 10) {
      S.gumBought -= 10;
      const missing = CARD_NAMES.map((_, i) => i).filter(i => !S.cards.includes(i));
      if (missing.length && Math.random() < .7) { const c = pick(missing); S.cards.push(c); toast(`Вкладыш! «${CARD_NAMES[c]}» (${S.cards.length}/${CARD_NAMES.length})`, 'good'); if (S.cards.length === CARD_NAMES.length) { rep('folk', 10); toast('Полный альбом! Школьники в восторге. Народ +10', 'good'); } }
    }
  }
  sfx.coin(); render();
}

// ============================================================
//  Обменник
// ============================================================
function exchHtml() {
  const buyRate = Math.round(S.rate * 1.04), sellRate = Math.round(S.rate * .96);
  const trade = S.phase !== 'morning';
  const pmpOpen = (chapter() === 2 || S.free) && S.day >= 14 && !S.pmpDead;
  return `<h2>💱 Обменник «Валюта 24»</h2>
    <canvas class="chart" id="chart"></canvas>
    <div class="row sp" style="margin-top:6px"><span>Купить $: <b>${fmt(buyRate)} ₽</b></span><span>Продать $: <b>${fmt(sellRate)} ₽</b></span></div>
    <p class="muted">Рубли тают каждый месяц. Доллары под матрасом — классика эпохи.</p>
    <div class="card"><div class="row sp"><b>Купить доллары</b><span>
      <button class="btn small" data-usd="buy" data-n="1" ${trade ? 'disabled' : ''}>$1</button>
      <button class="btn small" data-usd="buy" data-n="10" ${trade ? 'disabled' : ''}>$10</button>
      <button class="btn small" data-usd="buy" data-n="all" ${trade ? 'disabled' : ''}>На все</button></span></div>
      <div class="row sp" style="margin-top:8px"><b>Продать доллары</b><span>
      <button class="btn small" data-usd="sell" data-n="1" ${trade ? 'disabled' : ''}>$1</button>
      <button class="btn small" data-usd="sell" data-n="10" ${trade ? 'disabled' : ''}>$10</button>
      <button class="btn small" data-usd="sell" data-n="all" ${trade ? 'disabled' : ''}>Все</button></span></div></div>
    ${S.debt > 0 ? `<div class="card goal"><b>Долг «заводским»: $${S.debt}</b><div class="muted">Отдавать нужно в долларах. Срок — декабрь 1992.</div>
      <div class="row" style="margin-top:8px"><button class="btn small red" data-a="paydebt" ${S.usd < 1 || trade ? 'disabled' : ''}>Отдать $${Math.min(S.usd, S.debt)}</button></div></div>` : ''}
    ${pmpOpen || S.pmp > 0 ? `<div class="card"><b>🏦 Фонд «ПМП» — 30% в месяц!</b>
      <div class="muted">«Мы не летаем — мы растём!» Вложено сейчас: <b>${fmt(S.pmp)} ₽</b>. Выйти можно в любой момент... пока офис открыт.</div>
      <div class="row" style="margin-top:8px;gap:6px">
        <button class="btn small yellow" data-a="pmpIn" ${S.money < 100 || trade || S.pmpDead ? 'disabled' : ''}>Вложить ¼ кассы</button>
        <button class="btn small" data-a="pmpOut" ${S.pmp <= 0 || trade ? 'disabled' : ''}>Забрать всё</button></div></div>` : ''}
    ${S.voucher ? `<div class="card"><b>🎫 Ваучер:</b> ${{ fund: S.fundGone ? 'фонд «Золотой телёнок» исчез 🙃' : 'в фонде «Золотой телёнок» (обещают ×10)', zavod:'акции завода, дивиденды каждый месяц', sold:'продан' }[S.voucher]}</div>` : ''}`;
}
function drawChart() {
  const c = $('#chart'); if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr; const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const d = S.rateHist, mx = Math.max(...d) * 1.05, mn = Math.min(...d) * .95;
  g.strokeStyle = '#2f4a4a'; g.lineWidth = 1;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke(); }
  g.strokeStyle = '#7fe0a0'; g.lineWidth = 2; g.beginPath();
  d.forEach((v, i) => { const x = d.length === 1 ? w / 2 : 8 + i * (w - 16) / (d.length - 1), y = h - 10 - (v - mn) / (mx - mn || 1) * (h - 24); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.fillStyle = '#d6f0e0'; g.font = '700 12px "Courier New", monospace'; g.fillText('USD/RUB  ' + fmt(S.rate), 8, 16);
}
function usdOp(kind, n) {
  const buyRate = Math.round(S.rate * 1.04), sellRate = Math.round(S.rate * .96);
  if (kind === 'buy') {
    const k = n === 'all' ? Math.floor(S.money / buyRate) : Math.min(+n, Math.floor(S.money / buyRate));
    if (k <= 0) { toast('Не хватает рублей', 'bad'); return; }
    S.money -= k * buyRate; S.usd += k;
  } else {
    const k = n === 'all' ? S.usd : Math.min(+n, S.usd);
    if (k <= 0) { toast('Нет долларов', 'bad'); return; }
    S.usd -= k; S.money += k * sellRate;
  }
  sfx.coin(); render();
}

// ============================================================
//  Герой
// ============================================================
function heroHtml() {
  const SK = [['trade', 'Торговля', 'дешевле закупка (−4%/ур.)'], ['charm', 'Обаяние', 'покупатели терпимее к цене'], ['sense', 'Чуйка', 'больше терпения, легче ловить фальшивки; на 2 ур. видно, сколько готов дать покупатель']];
  return `<h2>👤 ${esc(S.name)}</h2>
    <div class="row"><canvas id="avatar" style="width:110px;height:120px;background:#dfe6dc;border-radius:8px;border:2px solid var(--ink)"></canvas>
      <div><div><b>Уровень ${S.lvl + 1}</b></div><div class="muted">Опыт ${S.xp}/${xpNeed(S.lvl)}</div>
      <div class="muted">${OUTFITS[S.outfit].icon} ${OUTFITS[S.outfit].name}</div>
      <div class="muted">${S.permit ? '📄 Разрешение на торговлю' : '📄 Без разрешения'}</div>
      <div class="muted">Капитал ≈ $${fmt(capitalUsd())}</div></div></div>
    <h3>Навыки ${S.sp ? `<span class="chip">очков: ${S.sp}</span>` : ''}</h3>
    <div class="card">${SK.map(([k, n, d]) => `<div class="skill"><div class="lv">${'★'.repeat(S.sk[k])}${'☆'.repeat(Math.max(0, 3 - S.sk[k]))}</div>
      <div style="flex:1"><b>${n}</b><div class="muted">${d}</div></div><button class="btn small" data-skill="${k}" ${S.sp > 0 && S.sk[k] < 3 ? '' : 'disabled'}>+</button></div>`).join('')}</div>
    <h3>Репутация</h3>
    <div class="card">
      <p><b>Улица ${Math.round(S.rep.street)}</b> — «заводские». От +30 ночью не трогают, от +40 «крыша» берёт меньше.</p>
      <p><b>Закон ${Math.round(S.rep.law)}</b> — милиция и администрация. Высокий — реже проверки.</p>
      <p><b>Народ ${Math.round(S.rep.folk)}</b> — жители. Больше покупателей и терпимее к цене. Ниже −40 — бойкот.</p></div>
    <h3>Альбом вкладышей «Турбина» ${S.cards.length}/${CARD_NAMES.length}</h3>
    <p class="muted">Каждые 10 купленных жвачек — шанс на вкладыш. Полный альбом — сюрприз.</p>
    <div class="cards">${CARD_NAMES.map((n, i) => `<div class="${S.cards.includes(i) ? 'got' : ''}" title="${S.cards.includes(i) ? n : '?'}">${S.cards.includes(i) ? '🏎' : '?'}</div>`).join('')}</div>
    <h3>Настройки</h3>
    <div class="row" style="gap:8px"><button class="btn small" data-a="mute">${S.mute ? '🔇 Звук выкл' : '🔊 Звук вкл'}</button>
      <button class="btn small red" data-a="reset">Начать заново</button></div>`;
}
function drawAvatar() {
  const c = $('#avatar'); if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2); c.width = 110 * dpr; c.height = 120 * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPerson(g, 55, 125, .85, heroLook(), 'happy', 0);
}

// ============================================================
//  События ввода
// ============================================================
document.addEventListener('click', e => {
  au();
  const el = e.target.closest('button, [data-a]'); if (!el || el.disabled) return;
  if (el.closest('#mbox')) return; // модалки обрабатываются отдельно
  const d = el.dataset;
  if (d.tab) { if (S.phase === 'trade' && d.tab !== 'kiosk') return; tab = d.tab; sfx.click(); render(); $('#screen').scrollTop = 0; return; }
  if (d.slot !== undefined) {
    if (S.phase === 'evening') return;
    openSlotPicker(+d.slot); return;
  }
  if (d.opt !== undefined) { chooseOpt(+d.opt); return; }
  if (d.buy) { buy(d.buy, +d.n); return; }
  if (d.src) { S.src = d.src; sfx.click(); render(); return; }
  if (d.outfit) { const o = OUTFITS[d.outfit], p = usdToRub(o.usd); if (S.money < p) return; S.money -= p; S.owned.push(d.outfit); S.outfit = d.outfit;
    if (d.outfit === 'sport') rep('street', 5); sfx.ching(); toast('Обновка! ' + o.name, 'good'); render(); return; }
  if (d.wear) { S.outfit = d.wear; sfx.click(); render(); return; }
  if (d.up) { const u = UPGRADES[d.up], p = usdToRub(u.usd); if (S.money < p) return; S.money -= p; S.up[d.up] = true;
    if (d.up === 'pavilion') { S.slots = S.slots.concat([null, null, null]).slice(0, 9); sfx.fanfare(); toast('Павильон открыт! Цель главы выполнена', 'good'); }
    else { sfx.ching(); toast(u.name + ' — готово!', 'good'); }
    render(); return; }
  if (d.usd) { usdOp(d.usd, d.n); return; }
  if (d.skill) { if (S.sp > 0 && S.sk[d.skill] < 3) { S.sp--; S.sk[d.skill]++; sfx.ching(); render(); } return; }
  switch (d.a) {
    case 'new': if (load()) queueCard({ title:'Начать заново?', html:'<p>Текущее сохранение пропадёт.</p>', buttons:[{ label:'Да, заново', cls:'red', fn() { setTimeout(startNewFlow, 0); } }, { label:'Отмена' }] }); else startNewFlow(); break;
    case 'continue': S = load(); S.phase = 'morning'; tab = 'kiosk'; offlineIncome(); render(); break;
    case 'open': startTrade(); break;
    case 'auto': { const r = autoDay(); S.phase = 'trade'; eveningFlow(r); break; }
    case 'hire': S.seller = true; sfx.ching(); toast('Тётя Люба вышла на смену!', 'good'); render(); break;
    case 'sell': case 'discount': case 'next': act(d.a); break;
    case 'paydebt': { const k = Math.min(S.usd, S.debt); S.usd -= k; S.debt -= k; sfx.ching(); toast(S.debt ? `Отдали $${k}. Осталось $${S.debt}` : 'Долг закрыт! Колян уважает.', 'good'); if (!S.debt) rep('street', 5); render(); break; }
    case 'pmpIn': { const k = Math.round(S.money / 4); S.money -= k; S.pmp += k; sfx.coin(); toast(`Вложено ${fmt(k)} ₽ в «ПМП»`); render(); break; }
    case 'pmpOut': { S.money += S.pmp; toast(`Забрали ${fmt(S.pmp)} ₽ из «ПМП»`, 'good'); S.pmp = 0; sfx.ching(); render(); break; }
    case 'mute': S.mute = !S.mute; render(); break;
    case 'reset': queueCard({ title:'Начать заново?', html:'<p>Весь прогресс пропадёт.</p>', buttons:[{ label:'Да', cls:'red', fn() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; T = null; render(); } }, { label:'Отмена' }] }); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.range === 'markup') {
    S.markup = +e.target.value / 100;
    const vit = document.querySelector('.vit'); if (vit) vit.outerHTML = vitrineHtml();
    const h = e.target.previousElementSibling; const mk = Math.round(S.markup * 100);
    if (h) h.innerHTML = `Наценка: ${mk}% <span class="chip">${mk <= 25 ? 'по-честному' : mk <= 60 ? 'как все' : mk <= 100 ? 'дерзко' : 'грабёж'}</span>`;
  }
});
document.addEventListener('change', e => { if (e.target.dataset.range) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.phase === 'morning') save(); });
window.addEventListener('resize', () => { if (tab === 'kiosk' && S) setupCanvas(); });

function offlineIncome() {
  if (!S.seller || !S.lastSeen) return;
  const hours = Math.min(8, (Date.now() - S.lastSeen) / 3.6e6);
  if (hours < .1) return;
  const r = autoDay(hours);
  if (r.rev <= 0) return;
  queueCard({ title:'👩 Пока вас не было', html:`<p>Тётя Люба торговала ${hours.toFixed(1)} ч и наторговала <b>${fmt(r.rev - r.theft)} ₽</b> (продано ${r.sold} шт.).</p>
    ${r.theft ? `<p class="muted">Касса почему-то не сходится на ${fmt(r.theft)} ₽...</p>` : ''}<p class="muted">Лимит — 8 часов.</p>` });
  save();
}

// ============================================================
//  Главный цикл
// ============================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (S) { tradeTick(dt); if (tab === 'kiosk') drawScene(dt); }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
// для отладки/тестов
window.__larek = { get S() { return S; }, get T() { return T; } };
})();
</script>
