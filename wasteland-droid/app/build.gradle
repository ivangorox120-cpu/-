plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wastelanddroid'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.wastelanddroid'
        // Snapdragon 870 и новее поставляются с Android 11+
        minSdk 30
        // ВАЖНО: targetSdk 28 — осознанно. Начиная с targetSdk 29 SELinux запрещает
        // exec/mmap(PROT_EXEC) файлов из каталога данных приложения (W^X), а рантайм
        // (glibc rootfs + Box64 + Wine) распаковывается именно туда. Приложение
        // распространяется только через APK (не Google Play).
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags ''; arguments '-DANDROID_STL=none' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
